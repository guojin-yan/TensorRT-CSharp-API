name: package-source

on:
  workflow_dispatch:
    inputs:
      version:
        description: Source archive version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      owner_publish_approved:
        description: Explicit Owner approval for GitHub Release publication side effects
        required: false
        default: false
        type: boolean
      artifact_name:
        description: Uploaded artifact name
        required: false
        default: source-package
        type: string
      release_tag:
        description: Optional GitHub Release tag
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload source archive to the GitHub Release
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: false
        default: 4.0.0
        type: string
      owner_publish_approved:
        required: false
        default: false
        type: boolean
      artifact_name:
        required: false
        default: source-package
        type: string
      release_tag:
        required: false
        default: ""
        type: string
      attach_to_github_release:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Enforce package publication policy
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/Test-ExternalVendorRuntimePackagePolicy.ps1 -StaticOnly
          if ('${{ github.repository_owner }}' -ne 'guojin-yan' -and '${{ inputs.attach_to_github_release }}' -eq 'true') {
            throw "The grape-yan repository is validation-only and cannot upload Release assets."
          }
          if ('${{ inputs.attach_to_github_release }}' -eq 'true' -and '${{ inputs.owner_publish_approved }}' -ne 'true') {
            throw "Source archive publication requires owner_publish_approved=true."
          }

      - name: Create tracked source archive
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/New-SourceArchive.ps1 -Version "${{ inputs.version }}"

      - name: Upload source artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            artifacts/source/*.zip
            artifacts/source/*.json

  attach-source:
    if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' && inputs.owner_publish_approved && github.repository_owner == 'guojin-yan' }}
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download source artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/source

      - name: Validate source archive license
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/Test-PublicationLicenseReadiness.ps1 -ArtifactPath ./artifacts/source

      - name: Attach source archive to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ inputs.release_tag }}" --repo "$env:GH_REPO" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "${{ inputs.release_tag }}" --title "${{ inputs.release_tag }}" --notes "Automated source release for ${{ inputs.release_tag }}" --repo "$env:GH_REPO"
            if ($LASTEXITCODE -ne 0) {
              gh release view "${{ inputs.release_tag }}" --repo "$env:GH_REPO" *> $null
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to create or observe Release '${{ inputs.release_tag }}'."
              }
            }
          }
          Get-ChildItem -LiteralPath ./artifacts/source -Filter *.zip -File | ForEach-Object {
            gh release upload "${{ inputs.release_tag }}" $_.FullName --clobber --repo "$env:GH_REPO"
            if ($LASTEXITCODE -ne 0) { throw "Failed to upload source archive '$($_.Name)'." }
          }
