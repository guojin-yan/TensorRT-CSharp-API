name: manual-quality-gate

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        required: true
        default: Release
      runtime_key:
        description: Runtime package key used for publish-readiness checks
        required: true
        default: win-x64-trt8.6-cuda11.8-cudnn8.9
      run_runtime_package_checks:
        description: Run checks that require prebuilt runtime nupkg artifacts
        required: true
        default: "false"
        type: choice
        options:
        - "false"
        - "true"
      smoke_runtime_key:
        description: Optional runtime key to smoke when runtime package checks are enabled
        required: false
        default: win-x64-trt8.6-cuda11.8-cudnn8.9

jobs:
  quality-gate:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore
      run: dotnet restore TensorRtSharp.sln

    - name: Validate runtime manifest
      run: pwsh -File .\eng\Validate-RuntimeManifest.ps1

    - name: Validate workflow contracts
      run: pwsh -File .\eng\Test-WorkflowContracts.ps1

    - name: Validate split delivery prototype
      run: pwsh -File .\eng\Validate-SplitDeliveryPrototype.ps1

    - name: Validate binding generator outputs
      run: pwsh -File .\eng\Test-BindingGeneratorOutputs.ps1

    - name: Restore local tools
      run: dotnet tool restore

    - name: Build docs
      run: dotnet docfx .\docs\docfx.json

    - name: Build
      run: dotnet build TensorRtSharp.sln -c "${{ github.event.inputs.configuration }}" --no-restore

    - name: Test project quality
      run: dotnet test .\tests\JYPPX.ProjectQuality.Tests\JYPPX.ProjectQuality.Tests.csproj -c "${{ github.event.inputs.configuration }}" --no-build

    - name: Pack managed package
      run: dotnet pack .\pack\JYPPX.TensorRT.CSharp.API\JYPPX.TensorRT.CSharp.API.csproj -c "${{ github.event.inputs.configuration }}" -o .\artifacts\managed

    - name: Test managed package content
      run: pwsh -File .\eng\Test-ManagedPackageContent.ps1

    - name: Explain skipped runtime package checks
      if: ${{ github.event.inputs.run_runtime_package_checks != 'true' }}
      shell: pwsh
      run: |
        Write-Host "Runtime package checks are disabled for this run."
        Write-Host "This keeps the hosted quality gate independent from large prebuilt runtime nupkg artifacts."
        Write-Host "Set run_runtime_package_checks=true on a runner that has artifacts/runtime-nupkg populated to run package consumer validation."

    - name: Test package consumer
      if: ${{ github.event.inputs.run_runtime_package_checks == 'true' }}
      run: pwsh -File .\eng\Test-PackageConsumer.ps1 -RuntimePackageKey "${{ github.event.inputs.runtime_key }}" -RunSmoke -SmokeRuntimePackageKey "${{ github.event.inputs.smoke_runtime_key }}"

    - name: Export runtime distribution report
      run: pwsh -File .\eng\Export-RuntimeDistributionReport.ps1

    - name: Export runtime delivery strategy
      run: pwsh -File .\eng\Export-RuntimeDeliveryStrategy.ps1

    - name: Test runtime publish readiness
      if: ${{ github.event.inputs.run_runtime_package_checks == 'true' }}
      run: pwsh -File .\eng\Test-RuntimePublishReadiness.ps1 -TargetMode public-preview -RuntimePackageKey "${{ github.event.inputs.runtime_key }}"

    - name: Export release gate summary
      run: pwsh -File .\eng\Export-ReleaseGateSummary.ps1

    - name: Export release candidate checklist
      run: pwsh -File .\eng\Export-ReleaseCandidateChecklist.ps1

    - name: Upload quality artifacts
      uses: actions/upload-artifact@v4
      with:
        name: quality-gate-artifacts
        path: |
          artifacts/managed/**
          artifacts/interop-comparison/**
          artifacts/runtime-distribution/**
          artifacts/package-consumer/**
          artifacts/release-candidate/**
          artifacts/workflow-contracts/**
