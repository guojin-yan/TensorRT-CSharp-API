name: linux-self-hosted-runner-readiness

on:
  workflow_dispatch:
    inputs:
      runtime_keys:
        description: Optional comma-separated Ubuntu 20.04 runtime keys
        required: false
        default: ""
        type: string
      runtime_key_set:
        description: Linux runtime key set to validate
        required: false
        default: self-hosted-ubuntu20
        type: string
      required_label_set:
        description: Required self-hosted runner label set
        required: false
        default: self-hosted,linux,x64,ubuntu-20.04
        type: string
      runner_root:
        description: Optional local GitHub Actions runner root
        required: false
        default: ""
        type: string
      check_github_runner:
        description: Query GitHub runner registration with RUNNER_AUDIT_TOKEN
        required: false
        default: true
        type: boolean
      warn_only:
        description: Report readiness failures as warnings instead of failing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  readiness:
    runs-on:
      - self-hosted
      - linux
      - x64
      - ubuntu-20.04
    env:
      GH_REPO: ${{ github.repository }}
      RUNNER_AUDIT_TOKEN: ${{ secrets.RUNNER_AUDIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Ubuntu 20.04 runner readiness
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:RUNNER_AUDIT_TOKEN)) {
            $env:GH_TOKEN = $env:RUNNER_AUDIT_TOKEN
          }

          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-LinuxSelfHostedRunnerReadiness.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-RuntimeKeySet",
            "${{ inputs.runtime_key_set }}",
            "-RequiredLabelSet",
            "${{ inputs.required_label_set }}",
            "-RequireRegisteredRunner"
          )

          foreach ($key in "${{ inputs.runtime_keys }}" -split "[,;]") {
            $trimmed = $key.Trim()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $arguments += @("-RuntimeKey", $trimmed)
            }
          }

          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.runner_root }}")) {
            $arguments += @("-RunnerRoot", "${{ inputs.runner_root }}")
          }

          if ("${{ inputs.check_github_runner }}" -eq "true" -and -not [string]::IsNullOrWhiteSpace($env:RUNNER_AUDIT_TOKEN)) {
            $arguments += "-CheckGitHubRunner"
          }
          elseif ("${{ inputs.check_github_runner }}" -eq "true") {
            Write-Warning "RUNNER_AUDIT_TOKEN is not set; skipping GitHub runner registration query. Local runner and runtime-root checks will still run."
          }

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Upload readiness artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-self-hosted-runner-readiness
          path: artifacts/linux-self-hosted-runner-readiness/**
