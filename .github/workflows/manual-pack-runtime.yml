name: manual-pack-runtime

on:
  workflow_dispatch:
    inputs:
      runtime_key:
        description: Runtime package key
        required: true
        default: win-x64-trt8.6-cuda11.8-cudnn8.9
      configure_preset:
        description: CMake configure preset
        required: true
        default: win-x64-trt8-cuda11-release
      build_preset:
        description: CMake build preset
        required: true
        default: win-x64-trt8-cuda11-release
      tensorrt_root:
        description: TensorRT root on the Windows runner
        required: true
      cuda_root:
        description: CUDA Toolkit root on the Windows runner
        required: true
      cudnn_root:
        description: cuDNN root on the Windows runner
        required: true

jobs:
  pack-runtime:
    runs-on:
    - self-hosted
    - windows
    - x64
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Restore
      run: dotnet restore TensorRtSharp.sln

    - name: Validate Windows runtime inputs
      run: powershell -ExecutionPolicy Bypass -File .\eng\Validate-WindowsRuntimeInputs.ps1 -RuntimePackageKey "${{ github.event.inputs.runtime_key }}" -TensorRtRoot "${{ github.event.inputs.tensorrt_root }}" -CudaRoot "${{ github.event.inputs.cuda_root }}" -CudnnRoot "${{ github.event.inputs.cudnn_root }}"

    - name: Configure native
      run: cmake --preset "${{ github.event.inputs.configure_preset }}" -DJYPPX_TENSORRT_ROOT="${{ github.event.inputs.tensorrt_root }}" -DCUDAToolkit_ROOT="${{ github.event.inputs.cuda_root }}" -DJYPPX_CUDA_ROOT="${{ github.event.inputs.cuda_root }}" -DJYPPX_CUDNN_ROOT="${{ github.event.inputs.cudnn_root }}"

    - name: Build native
      run: cmake --build --preset "${{ github.event.inputs.build_preset }}"

    - name: Collect runtime assets
      run: powershell -ExecutionPolicy Bypass -File .\eng\Collect-RuntimeAssets.ps1 -RuntimePackageKey "${{ github.event.inputs.runtime_key }}" -TensorRtRoot "${{ github.event.inputs.tensorrt_root }}" -CudaRoot "${{ github.event.inputs.cuda_root }}" -CudnnRoot "${{ github.event.inputs.cudnn_root }}"

    - name: Resolve runtime project path
      shell: pwsh
      run: |
        $manifest = Get-Content .\pack\runtime\runtime-packages.manifest.json -Raw | ConvertFrom-Json
        $package = $manifest.packages | Where-Object { $_.key -eq '${{ github.event.inputs.runtime_key }}' } | Select-Object -First 1
        if (-not $package) { throw "Runtime key not found." }
        $projectPath = ".\pack\runtime\${{ github.event.inputs.runtime_key }}\$($package.packageId).csproj"
        "RUNTIME_PROJECT_PATH=$projectPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Pack runtime package
      run: dotnet pack "${{ env.RUNTIME_PROJECT_PATH }}" -c Release -o .\artifacts\runtime-nupkg

    - name: Pack managed package
      run: dotnet pack .\pack\JYPPX.TensorRT.CSharp.API\JYPPX.TensorRT.CSharp.API.csproj -c Release -o .\artifacts\managed

    - name: Test managed package content
      run: powershell -ExecutionPolicy Bypass -File .\eng\Test-ManagedPackageContent.ps1

    - name: Test package consumer
      run: powershell -ExecutionPolicy Bypass -File .\eng\Test-PackageConsumer.ps1 -RuntimePackageKey "${{ github.event.inputs.runtime_key }}" -RunSmoke

    - name: Resolve publish readiness mode
      shell: pwsh
      run: |
        $manifest = Get-Content .\pack\runtime\runtime-packages.manifest.json -Raw | ConvertFrom-Json
        $package = $manifest.packages | Where-Object { $_.key -eq '${{ github.event.inputs.runtime_key }}' } | Select-Object -First 1
        if (-not $package) { throw "Runtime key not found." }
        $mode = switch ($package.distributionTier) {
          'public-sample' { 'public-preview' }
          'private-feed' { 'private-feed' }
          default { 'split-delivery' }
        }
        "RUNTIME_PUBLISH_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Test publish readiness
      run: pwsh -File .\eng\Test-RuntimePublishReadiness.ps1 -TargetMode "${{ env.RUNTIME_PUBLISH_MODE }}" -RuntimePackageKey "${{ github.event.inputs.runtime_key }}"

    - name: Validate split delivery prototype
      run: pwsh -File .\eng\Validate-SplitDeliveryPrototype.ps1

    - name: Export runtime delivery strategy
      run: pwsh -File .\eng\Export-RuntimeDeliveryStrategy.ps1

    - name: Export release gate summary
      run: pwsh -File .\eng\Export-ReleaseGateSummary.ps1

    - name: Upload runtime artifacts
      uses: actions/upload-artifact@v4
      with:
        name: runtime-${{ github.event.inputs.runtime_key }}
        path: |
          artifacts/runtime/**
          artifacts/runtime-nupkg/**
          artifacts/managed/**
          build-out/package-consumer/**
          artifacts/runtime-distribution/**
