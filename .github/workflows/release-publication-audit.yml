name: release-publication-audit

on:
  workflow_dispatch:
    inputs:
      managed_version:
        description: Optional managed package version to audit
        required: false
        default: ""
        type: string
      release_tag:
        description: Optional managed package GitHub Release tag to audit
        required: false
        default: ""
        type: string
      runtime_release_tags:
        description: Comma-separated runtime Release tags to audit
        required: false
        default: "v4.0.6156,v4.0.6167,v4.0.6169"
        type: string
      expected_release_tags:
        description: Comma-separated GitHub Release tags expected to remain published
        required: false
        default: "v4.0.6170,v4.0.6156,v4.0.6167,v4.0.6169"
        type: string
      require_nuget_api_key:
        description: Fail when NUGET_API_KEY is missing
        required: false
        default: false
        type: boolean
      require_managed_github_packages:
        description: Fail when the managed version is missing from GitHub Packages
        required: false
        default: false
        type: boolean
      require_managed_nuget_org:
        description: Fail when the managed version is missing from nuget.org
        required: false
        default: false
        type: boolean
      require_managed_release_asset:
        description: Fail when the managed package is missing from the GitHub Release assets
        required: false
        default: false
        type: boolean
      require_runtime_github_packages_coverage:
        description: Fail when runtime Release assets are missing from GitHub Packages
        required: false
        default: true
        type: boolean
      check_failed_workflow_runs:
        description: Include a failed workflow run audit
        required: false
        default: true
        type: boolean
      require_publication_inventory_clean:
        description: Fail when unexpected GitHub Releases or package versions remain
        required: false
        default: true
        type: boolean
      require_package_repository_association:
        description: Fail when expected GitHub Package versions are not associated with this repository
        required: false
        default: true
        type: boolean
      include_release_readiness:
        description: Emit release readiness report for external publication prerequisites
        required: false
        default: true
        type: boolean
      runner_required_label_sets:
        description: Semicolon-separated self-hosted runner label sets to audit
        required: false
        default: "self-hosted,windows,x64;self-hosted,linux,x64,ubuntu-20.04"
        type: string
      warn_only:
        description: Report failed checks as warnings instead of failing the workflow
        required: false
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  packages: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      HAS_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY != '' }}
      RUNNER_AUDIT_TOKEN: ${{ secrets.RUNNER_AUDIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit release publication state
        shell: pwsh
        run: |
          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-ReleasePublicationState.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-NuGetApiKeyAvailable",
            "$env:HAS_NUGET_API_KEY"
          )

          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.managed_version }}")) {
            $arguments += @("-ManagedVersion", "${{ inputs.managed_version }}")
          }

          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.release_tag }}")) {
            $arguments += @("-ReleaseTag", "${{ inputs.release_tag }}")
          }

          if (-not [string]::IsNullOrWhiteSpace("${{ inputs.runtime_release_tags }}")) {
            $arguments += @("-RuntimeReleaseTag", "${{ inputs.runtime_release_tags }}")
          }

          if ("${{ inputs.require_nuget_api_key }}" -eq "true") {
            $arguments += "-RequireNuGetApiKey"
          }

          if ("${{ inputs.require_managed_github_packages }}" -eq "true") {
            $arguments += "-RequireManagedGitHubPackages"
          }

          if ("${{ inputs.require_managed_nuget_org }}" -eq "true") {
            $arguments += "-RequireManagedNuGetOrg"
          }

          if ("${{ inputs.require_managed_release_asset }}" -eq "true") {
            $arguments += "-RequireManagedReleaseAsset"
          }

          if ("${{ inputs.require_runtime_github_packages_coverage }}" -eq "true") {
            $arguments += "-RequireRuntimeGitHubPackagesCoverage"
          }

          if ("${{ inputs.check_failed_workflow_runs }}" -eq "true") {
            $arguments += "-CheckFailedWorkflowRuns"
          }

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Audit GitHub publication inventory
        shell: pwsh
        run: |
          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-GitHubPublicationInventory.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-ExpectedReleaseTag",
            "${{ inputs.expected_release_tags }}"
          )

          if ("${{ inputs.require_publication_inventory_clean }}" -eq "true") {
            $arguments += @(
              "-RequireOnlyExpectedReleases",
              "-RequireOnlyExpectedPackageVersions"
            )
          }

          if ("${{ inputs.require_package_repository_association }}" -eq "true") {
            $arguments += "-RequirePackageRepositoryAssociation"
          }

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Export runtime publication index
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/Export-RuntimePublicationIndex.ps1 -Repository "$env:GH_REPO"

      - name: Audit Linux runtime target coverage
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/Test-LinuxRuntimeTargetCoverage.ps1 -RequireFutureTargetPlaceholders

      - name: Audit runtime publication target coverage
        shell: pwsh
        run: |
          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-RuntimePublicationTargetCoverage.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-ExpectedReleaseTag",
            "${{ inputs.expected_release_tags }}"
          )

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Audit release readiness
        if: ${{ inputs.include_release_readiness }}
        shell: pwsh
        run: |
          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-ReleaseReadiness.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-NuGetApiKeyAvailable",
            "$env:HAS_NUGET_API_KEY",
            "-RunnerAuditTokenAvailable",
            "${{ secrets.RUNNER_AUDIT_TOKEN != '' }}"
          )

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Audit remote release prerequisites
        shell: pwsh
        run: |
          $labelSetText = @'
          ${{ inputs.runner_required_label_sets }}
          '@
          $labelSets = @(
            $labelSetText -split "[`r`n;]" |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-RemoteReleasePrerequisites.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-NuGetApiKeyAvailable",
            "$env:HAS_NUGET_API_KEY",
            "-RunnerAuditTokenAvailable",
            "${{ secrets.RUNNER_AUDIT_TOKEN != '' }}"
          )

          if ($labelSets.Count -gt 0) {
            $arguments += @("-RequiredRunnerLabelSet", ($labelSets -join ";"))
          }

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Audit runner availability
        shell: pwsh
        run: |
          $labelSetText = @'
          ${{ inputs.runner_required_label_sets }}
          '@
          $labelSets = @(
            $labelSetText -split "[`r`n;]" |
              ForEach-Object { $_.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          if ($labelSets.Count -eq 0) {
            Write-Host "No runner label sets were requested for audit."
            return
          }

          if ([string]::IsNullOrWhiteSpace($env:RUNNER_AUDIT_TOKEN)) {
            $outputRoot = Join-Path (Get-Location).Path "artifacts/runner-availability"
            New-Item -ItemType Directory -Path $outputRoot -Force | Out-Null

            $message = "RUNNER_AUDIT_TOKEN is not set; runner availability cannot be queried from GitHub Actions' default GITHUB_TOKEN."
            [pscustomobject]@{
              repository = $env:GH_REPO
              runnerAuditTokenAvailable = $false
              failedCount = $labelSets.Count
              requestedLabelSets = @($labelSets)
              message = $message
            } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $outputRoot "github-runner-availability.json") -Encoding utf8

            $lines = @(
              "# GitHub Runner Availability",
              "",
              "Repository: ``$env:GH_REPO``",
              "",
              "| Required labels | Audited | Detail |",
              "| --- | --- | --- |"
            )
            foreach ($labelSet in $labelSets) {
              $lines += "| ``$labelSet`` | False | $message |"
            }
            $lines += ""
            $lines += "To enable this audit, store a fine-grained token in repository secret ``RUNNER_AUDIT_TOKEN`` with repository ``Administration`` read permission."
            $lines | Set-Content -LiteralPath (Join-Path $outputRoot "github-runner-availability.md") -Encoding utf8

            if ("${{ inputs.warn_only }}" -eq "true") {
              Write-Warning $message
              return
            }

            throw $message
          }

          $env:GH_TOKEN = $env:RUNNER_AUDIT_TOKEN
          $arguments = @(
            "-NoProfile",
            "-File",
            "./eng/Test-GitHubRunnerAvailability.ps1",
            "-Repository",
            "$env:GH_REPO",
            "-RequiredLabelSet",
            ($labelSets -join ";")
          )

          if ("${{ inputs.warn_only }}" -eq "true") {
            $arguments += "-WarnOnly"
          }

          & pwsh @arguments

      - name: Upload audit artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-publication-audit
          path: |
            artifacts/release-publication/**
            artifacts/github-packages-audit/**
            artifacts/publication-inventory/**
            artifacts/publication-index/**
            artifacts/release-readiness/**
            artifacts/remote-release-prerequisites/**
            artifacts/runner-availability/**
            artifacts/linux-target-coverage/**
            artifacts/runtime-publication-target-coverage/**
