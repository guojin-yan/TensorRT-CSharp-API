name: docs-release

on:
  workflow_dispatch:
    inputs:
      owner_publish_approved:
        description: Explicit Owner approval for API documentation deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: ${{ inputs.owner_publish_approved && github.repository_owner == 'guojin-yan' }}
    runs-on: windows-latest
    environment:
      name: production-release
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production release Environment readiness
        shell: pwsh
        env:
          PRODUCTION_RELEASE_READY: ${{ secrets.PRODUCTION_RELEASE_READY }}
        run: pwsh -NoProfile -File .\eng\Test-ProductionReleaseEnvironment.ps1 -ReadyMarker $env:PRODUCTION_RELEASE_READY

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore TensorRtSharp.sln

      - name: Validate public API bilingual documentation
        run: pwsh -NoProfile -File .\eng\Test-PublicApiBilingualDocumentation.ps1

      - name: Build docs
        run: dotnet docfx .\docs\docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
