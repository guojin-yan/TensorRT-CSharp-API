name: docs-release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs-release.yml"
      - "docs/**"
      - "eng/Test-PublicApiDocumentation.ps1"
      - "eng/Test-PublicApiBilingualDocumentation.ps1"
      - "src/**"
      - "README.md"
      - "README.zh-CN.md"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore local tools
        run: dotnet tool restore

      - name: Restore solution
        run: dotnet restore TensorRtSharp.sln

      - name: Validate public API bilingual documentation
        run: pwsh -NoProfile -File .\eng\Test-PublicApiBilingualDocumentation.ps1

      - name: Build docs
        run: dotnet docfx .\docs\docfx.json

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
