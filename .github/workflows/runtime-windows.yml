name: runtime-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: ""
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: full
        type: string
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: true
        type: boolean
      publish_to_github_packages:
        description: Publish packages to GitHub Packages
        required: false
        default: true
        type: boolean
      attach_to_github_release:
        description: Upload runtime packages as GitHub Release assets
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: ""
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: full
        type: string
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: true
        type: boolean
      publish_to_github_packages:
        description: Publish packages to GitHub Packages
        required: false
        default: true
        type: boolean
      attach_to_github_release:
        description: Upload runtime packages as GitHub Release assets
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $value = pwsh -NoProfile -File .\eng\Resolve-PackageVersion.ps1 -RequestedVersion "${{ inputs.version }}"
          "package_version=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve Windows runtime matrix
        id: matrix
        shell: pwsh
        run: |
          $value = pwsh -NoProfile -File .\eng\Resolve-RuntimeMatrix.ps1 -Platform windows -RuntimeKey "${{ inputs.runtime_keys }}"
          "value={""include"":$value}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  managed:
    needs: prepare
    uses: ./.github/workflows/package-managed.yml
    with:
      version: ${{ needs.prepare.outputs.package_version }}
      configuration: ${{ inputs.configuration }}
      publish_to_nuget: false
      publish_to_github_packages: false
      artifact_name: managed-packages-runtime-windows
    secrets: inherit

  pack-runtime:
    needs:
      - prepare
      - managed
    runs-on:
      - self-hosted
      - windows
      - x64
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: managed-packages-runtime-windows
          path: artifacts/managed

      - name: Restore solution
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        run: dotnet restore TensorRtSharp.sln

      - name: Resolve runtime roots
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        id: roots
        shell: pwsh
        run: |
          $resolved = pwsh -NoProfile -File .\eng\Resolve-RuntimeRoots.ps1 -RuntimePackageKey "${{ matrix.key }}" | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($resolved.tensorRtRoot)) { throw "TensorRT root is not configured for $($resolved.runtimeKey)." }
          if ([string]::IsNullOrWhiteSpace($resolved.cudaRoot)) { throw "CUDA root is not configured for $($resolved.runtimeKey)." }
          if ([string]::IsNullOrWhiteSpace($resolved.cudnnRoot)) { throw "cuDNN root is not configured for $($resolved.runtimeKey)." }
          "tensor_rt_root=$($resolved.tensorRtRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cuda_root=$($resolved.cudaRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cudnn_root=$($resolved.cudnnRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate Windows runtime inputs
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        run: pwsh -NoProfile -File .\eng\Validate-WindowsRuntimeInputs.ps1 -RuntimePackageKey "${{ matrix.key }}" -TensorRtRoot "${{ steps.roots.outputs.tensor_rt_root }}" -CudaRoot "${{ steps.roots.outputs.cuda_root }}" -CudnnRoot "${{ steps.roots.outputs.cudnn_root }}"

      - name: Configure native bridge
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        run: cmake --preset "${{ matrix.buildPreset }}" -DJYPPX_TENSORRT_ROOT="${{ steps.roots.outputs.tensor_rt_root }}" -DCUDAToolkit_ROOT="${{ steps.roots.outputs.cuda_root }}" -DJYPPX_CUDA_ROOT="${{ steps.roots.outputs.cuda_root }}" -DJYPPX_CUDNN_ROOT="${{ steps.roots.outputs.cudnn_root }}"

      - name: Build native bridge
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        run: cmake --build --preset "${{ matrix.buildPreset }}"

      - name: Collect runtime assets
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        run: pwsh -NoProfile -File .\eng\Collect-RuntimeAssets.ps1 -RuntimePackageKey "${{ matrix.key }}" -TensorRtRoot "${{ steps.roots.outputs.tensor_rt_root }}" -CudaRoot "${{ steps.roots.outputs.cuda_root }}" -CudnnRoot "${{ steps.roots.outputs.cudnn_root }}"

      - name: Pack runtime package
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        run: dotnet pack ".\pack\runtime\${{ matrix.key }}\${{ matrix.packageId }}.csproj" -c "${{ inputs.configuration }}" -o .\artifacts\runtime-nupkg -p:JYPPXPackageVersion=${{ needs.prepare.outputs.package_version }}

      - name: Validate runtime package consumer
        if: ${{ inputs.runtime_delivery_mode != 'split' && !inputs.run_smoke }}
        run: pwsh -NoProfile -File .\eng\Test-PackageConsumer.ps1 -RuntimePackageKey "${{ matrix.key }}" -ManagedPackageDirectory ".\artifacts\managed" -RuntimePackageDirectory ".\artifacts\runtime-nupkg"

      - name: Validate runtime package consumer with smoke
        if: ${{ inputs.runtime_delivery_mode != 'split' && inputs.run_smoke }}
        run: pwsh -NoProfile -File .\eng\Test-PackageConsumer.ps1 -RuntimePackageKey "${{ matrix.key }}" -ManagedPackageDirectory ".\artifacts\managed" -RuntimePackageDirectory ".\artifacts\runtime-nupkg" -RunSmoke

      - name: Build split runtime packages
        if: ${{ inputs.runtime_delivery_mode == 'split' }}
        run: |
          $arguments = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', '.\eng\Invoke-LocalSplitRuntimePackage.ps1',
            '-SourceRuntimeKey', '${{ matrix.key }}',
            '-Version', '${{ needs.prepare.outputs.package_version }}',
            '-Configuration', '${{ inputs.configuration }}',
            '-SkipManagedPack'
          )
          if ('${{ inputs.run_smoke }}' -eq 'true') {
            $arguments += '-RunSmoke'
          }
          powershell @arguments

      - name: Upload Windows runtime artifacts
        if: ${{ inputs.attach_to_github_release && inputs.runtime_delivery_mode != 'split' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-${{ matrix.key }}
          path: |
            artifacts/runtime-nupkg/*.nupkg
            artifacts/runtime/${{ matrix.key }}/**
            artifacts/package-consumer/**

      - name: Upload Windows split runtime artifacts
        if: ${{ inputs.attach_to_github_release && inputs.runtime_delivery_mode == 'split' }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-windows-${{ matrix.key }}
          path: |
            artifacts/runtime-split-nupkg/${{ matrix.key }}/*.nupkg
            artifacts/runtime/${{ matrix.key }}/**
            artifacts/runtime-split/**
            artifacts/package-consumer/**

      - name: Publish Windows runtime package to GitHub Packages
        if: ${{ inputs.publish_to_github_packages && inputs.runtime_delivery_mode != 'split' }}
        shell: pwsh
        run: |
          $maxBytes = 2147000000
          $packages = Get-ChildItem -LiteralPath .\artifacts\runtime-nupkg -Filter *.nupkg
          foreach ($package in $packages) {
            if ($package.Length -ge $maxBytes) {
              $actualMb = [Math]::Round($package.Length / 1MB, 2)
              throw "Runtime package '$($package.Name)' is ${actualMb} MB and exceeds the GitHub NuGet registry limit (< 2.147 GB). Split the runtime package before publishing."
            }
          }

          dotnet nuget push .\artifacts\runtime-nupkg\*.nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ github.token }}" `
            --skip-duplicate

      - name: Publish Windows split runtime packages to GitHub Packages
        if: ${{ inputs.publish_to_github_packages && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        run: |
          dotnet nuget push ".\artifacts\runtime-split-nupkg\${{ matrix.key }}\*.nupkg" `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ github.token }}" `
            --skip-duplicate
