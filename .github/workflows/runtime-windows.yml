name: runtime-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: "win-x64-trt8.6-cuda11.8-cudnn8.9,win-x64-trt8.6-cuda12.1-cudnn8.9,win-x64-trt10.11-cuda11.8-cudnn8.9,win-x64-trt10.11-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda13.2-cudnn9.22"
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: split
        type: string
      split_package_roles:
        description: Optional comma-separated split package roles or keys to build
        required: false
        default: all
        type: string
      meta_package_version:
        description: Optional split meta package version override
        required: false
        default: ""
        type: string
      bridge_package_version:
        description: Optional bridge split package version override
        required: false
        default: ""
        type: string
      vendor_package_version:
        description: Optional default version for CUDA/cuDNN/TensorRT split packages
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version:
        description: Optional CUDA/cuDNN split package version override
        required: false
        default: ""
        type: string
      tensorrt_package_version:
        description: Optional TensorRT split package version override
        required: false
        default: ""
        type: string
      vendor_package_release_tag:
        description: Optional GitHub Release tag that contains previously published vendor split packages; defaults to v<vendor package version>
        required: false
        default: ""
        type: string
      include_meta_package:
        description: Build the split meta package even when only a subset of roles is selected
        required: false
        default: false
        type: boolean
      skip_consumer_validation:
        description: Skip split runtime package consumer validation
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: true
        type: boolean
      smoke_runtime_keys:
        description: Optional comma-separated runtime keys that should run smoke
        required: false
        default: "win-x64-trt8.6-cuda11.8-cudnn8.9,win-x64-trt8.6-cuda12.1-cudnn8.9,win-x64-trt11.0-cuda12.9-cudnn9.22"
        type: string
      sign_consumer_output:
        description: Sign consumer output before smoke on the self-hosted runner
        required: false
        default: true
        type: boolean
      publish_to_github_packages:
        description: Publish packages to GitHub Packages; large vendor packages should normally stay on GitHub Release assets
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional GitHub Release tag for direct asset upload
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload runtime packages as GitHub Release assets
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: ""
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: split
        type: string
      split_package_roles:
        description: Optional comma-separated split package roles or keys to build
        required: false
        default: all
        type: string
      meta_package_version:
        description: Optional split meta package version override
        required: false
        default: ""
        type: string
      bridge_package_version:
        description: Optional bridge split package version override
        required: false
        default: ""
        type: string
      vendor_package_version:
        description: Optional default version for CUDA/cuDNN/TensorRT split packages
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version:
        description: Optional CUDA/cuDNN split package version override
        required: false
        default: ""
        type: string
      tensorrt_package_version:
        description: Optional TensorRT split package version override
        required: false
        default: ""
        type: string
      vendor_package_release_tag:
        description: Optional GitHub Release tag that contains previously published vendor split packages; defaults to v<vendor package version>
        required: false
        default: ""
        type: string
      include_meta_package:
        description: Build the split meta package even when only a subset of roles is selected
        required: false
        default: false
        type: boolean
      skip_consumer_validation:
        description: Skip split runtime package consumer validation
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: true
        type: boolean
      smoke_runtime_keys:
        description: Optional comma-separated runtime keys that should run smoke
        required: false
        default: ""
        type: string
      sign_consumer_output:
        description: Sign consumer output before smoke on the self-hosted runner
        required: false
        default: true
        type: boolean
      publish_to_github_packages:
        description: Publish packages to GitHub Packages; large vendor packages should normally stay on GitHub Release assets
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional GitHub Release tag for direct asset upload
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload runtime packages as GitHub Release assets
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  pack-runtime:
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - name: Prepare Windows runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,Root,@{Name='FreeGB';Expression={[math]::Round($_.Free/1GB,2)}} |
            Format-Table -AutoSize

      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify local .NET
        shell: pwsh
        run: dotnet --info

      - name: Verify local CMake
        shell: pwsh
        run: cmake --version

      - name: Build full runtime packages
        if: ${{ inputs.runtime_delivery_mode != 'split' }}
        shell: pwsh
        run: |
          $arguments = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', '.\eng\Invoke-LocalRuntimePackage.ps1',
            '-RuntimePackageKey', '${{ inputs.runtime_keys }}',
            '-Version', '${{ inputs.version }}',
            '-Configuration', '${{ inputs.configuration }}'
          )
          if ('${{ inputs.run_smoke }}' -eq 'true') {
            $arguments += '-RunSmoke'
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.smoke_runtime_keys }}')) {
              $arguments += @('-SmokeRuntimePackageKey', '${{ inputs.smoke_runtime_keys }}')
            }
            if ('${{ inputs.sign_consumer_output }}' -eq 'true') {
              $arguments += '-SignConsumerOutput'
              $arguments += '-TrustConsumerSigningCertificate'
              $arguments += '-TrustConsumerSigningCertificateRoot'
            }
          }
          powershell @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Invoke-LocalRuntimePackage.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Build split runtime packages
        if: ${{ inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $keys = @()
          foreach ($part in '${{ inputs.runtime_keys }}' -split '[,;]') {
            $trimmed = $part.Trim()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $keys += $trimmed
            }
          }
          $smokeKeys = @()
          foreach ($part in '${{ inputs.smoke_runtime_keys }}' -split '[,;]') {
            $trimmed = $part.Trim()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $smokeKeys += $trimmed
            }
          }
          $roleText = '${{ inputs.split_package_roles }}'
          $roleTokens = @()
          foreach ($part in $roleText -split '[,;]') {
            $trimmed = $part.Trim().ToLowerInvariant()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $roleTokens += $trimmed
            }
          }
          $shouldResolvePublishedPackages = (
            '${{ inputs.include_meta_package }}' -eq 'true' -or
            $roleTokens -contains 'all' -or
            $roleTokens -contains 'meta' -or
            $roleTokens -contains 'collection'
          )

          foreach ($key in ($keys | Select-Object -Unique)) {
            $arguments = @(
              '-NoProfile',
              '-ExecutionPolicy', 'Bypass',
              '-File', '.\eng\Invoke-LocalSplitRuntimePackage.ps1',
              '-SourceRuntimeKey', $key,
              '-Version', '${{ inputs.version }}',
              '-SplitPackageRole', '${{ inputs.split_package_roles }}',
              '-Configuration', '${{ inputs.configuration }}'
            )
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.meta_package_version }}')) {
              $arguments += @('-MetaPackageVersion', '${{ inputs.meta_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.bridge_package_version }}')) {
              $arguments += @('-BridgePackageVersion', '${{ inputs.bridge_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.vendor_package_version }}')) {
              $arguments += @('-VendorPackageVersion', '${{ inputs.vendor_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}')) {
              $arguments += @('-CudaCudnnPackageVersion', '${{ inputs.cuda_cudnn_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}')) {
              $arguments += @('-TensorRtPackageVersion', '${{ inputs.tensorrt_package_version }}')
            }
            if ('${{ inputs.include_meta_package }}' -eq 'true') {
              $arguments += '-IncludeMetaPackage'
            }
            if ('${{ inputs.skip_consumer_validation }}' -eq 'true') {
              $arguments += '-SkipConsumerValidation'
            }
            if ($shouldResolvePublishedPackages) {
              $additionalPackageSources = New-Object System.Collections.Generic.List[string]
              $safeKey = $key -replace '[^A-Za-z0-9._-]', '-'
              $publishedPackageSourceFile = Join-Path $env:RUNNER_TEMP "jyppx-published-package-source-$safeKey.txt"
              $restoreArguments = @(
                '-NoProfile',
                '-ExecutionPolicy', 'Bypass',
                '-File', '.\eng\Restore-PublishedSplitPackageSource.ps1',
                '-SourceRuntimeKey', $key,
                '-SplitPackageRole', '${{ inputs.split_package_roles }}',
                '-Version', '${{ inputs.version }}',
                '-Repository', "$env:GH_REPO",
                '-OutputPathFile', $publishedPackageSourceFile
              )
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.bridge_package_version }}')) {
                $restoreArguments += @('-BridgePackageVersion', '${{ inputs.bridge_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.vendor_package_version }}')) {
                $restoreArguments += @('-VendorPackageVersion', '${{ inputs.vendor_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}')) {
                $restoreArguments += @('-CudaCudnnPackageVersion', '${{ inputs.cuda_cudnn_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}')) {
                $restoreArguments += @('-TensorRtPackageVersion', '${{ inputs.tensorrt_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.vendor_package_release_tag }}')) {
                $restoreArguments += @('-VendorPackageReleaseTag', '${{ inputs.vendor_package_release_tag }}')
              }

              powershell @restoreArguments
              if ($LASTEXITCODE -ne 0) {
                throw "Restore-PublishedSplitPackageSource.ps1 failed for runtime key '$key' with exit code $LASTEXITCODE."
              }

              $publishedPackageSource = if (Test-Path -LiteralPath $publishedPackageSourceFile -PathType Leaf) {
                (Get-Content -LiteralPath $publishedPackageSourceFile -Raw).Trim()
              }
              else {
                ""
              }

              if (-not [string]::IsNullOrWhiteSpace($publishedPackageSource)) {
                $additionalPackageSources.Add($publishedPackageSource)
              }
              $additionalPackageSources.Add('https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json')

              $arguments += @(
                '-AdditionalPackageSource',
                ($additionalPackageSources -join ','),
                '-AdditionalPackageSourceUsername',
                '${{ github.actor }}',
                '-AdditionalPackageSourcePassword',
                '${{ github.token }}'
              )
            }
            $shouldRunSmoke = ('${{ inputs.run_smoke }}' -eq 'true') -and ($smokeKeys.Count -eq 0 -or $smokeKeys -contains $key)
            if ($shouldRunSmoke) {
              $arguments += '-RunSmoke'
              if ('${{ inputs.sign_consumer_output }}' -eq 'true') {
                $arguments += '-SignConsumerOutput'
                $arguments += '-TrustConsumerSigningCertificate'
                $arguments += '-TrustConsumerSigningCertificateRoot'
              }
            }
            powershell @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Invoke-LocalSplitRuntimePackage.ps1 failed for runtime key '$key' with exit code $LASTEXITCODE."
            }
          }

      - name: Prune Windows runtime intermediates
        if: ${{ always() }}
        shell: pwsh
        run: |
          $paths = @(
            '.\artifacts\runtime',
            '.\artifacts\runtime-split',
            '.\build-out',
            (Join-Path $env:SystemDrive 'jyppx-pkgcache')
          )

          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Pruned $path"
            }
          }

          foreach ($root in @('.\pack\runtime', '.\pack\runtime-split')) {
            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            foreach ($directory in Get-ChildItem -LiteralPath $root -Directory) {
              foreach ($child in @('assets', 'bin', 'obj')) {
                $candidate = Join-Path $directory.FullName $child
                if (Test-Path -LiteralPath $candidate) {
                  Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Pruned $candidate"
                }
              }
            }
          }

          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,Root,@{Name='FreeGB';Expression={[math]::Round($_.Free/1GB,2)}} |
            Format-Table -AutoSize

      - name: Upload Windows runtime artifacts
        if: ${{ inputs.attach_to_github_release && inputs.release_tag == '' && inputs.runtime_delivery_mode != 'split' }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: runtime-windows-full
          path: |
            artifacts/managed/*.nupkg
            artifacts/runtime-nupkg/*.nupkg
            artifacts/package-consumer/package-consumer-validation-summary.*
            artifacts/local-runtime-validation/*.json
            artifacts/local-runtime-validation/*.md

      - name: Upload Windows split runtime artifacts
        if: ${{ inputs.attach_to_github_release && inputs.release_tag == '' && inputs.runtime_delivery_mode == 'split' }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: runtime-windows-split
          path: |
            artifacts/managed/*.nupkg
            artifacts/runtime-split-nupkg/**/*.nupkg
            artifacts/package-consumer/package-consumer-validation-summary.*
            artifacts/local-runtime-validation/*.json
            artifacts/local-runtime-validation/*.md

      - name: Upload Windows runtime packages to GitHub Release
        if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' && inputs.runtime_delivery_mode != 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath .\artifacts\runtime-nupkg -Filter *.nupkg | Sort-Object Name)
          if ($packages.Count -eq 0) {
            throw "No Windows runtime packages were found for direct release upload."
          }

          foreach ($package in $packages) {
            Write-Host "Uploading release asset: $($package.FullName)"
            gh release upload "${{ inputs.release_tag }}" $package.FullName --clobber --repo "$env:GH_REPO"
          }

      - name: Upload Windows split runtime packages to GitHub Release
        if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath .\artifacts\runtime-split-nupkg -Filter *.nupkg -Recurse | Sort-Object FullName)
          if ($packages.Count -eq 0) {
            throw "No Windows split runtime packages were found for direct release upload."
          }

          foreach ($package in $packages) {
            Write-Host "Uploading release asset: $($package.FullName)"
            gh release upload "${{ inputs.release_tag }}" $package.FullName --clobber --repo "$env:GH_REPO"
          }

      - name: Publish Windows runtime package to GitHub Packages
        if: ${{ inputs.publish_to_github_packages && inputs.runtime_delivery_mode != 'split' }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $maxBytes = 2147000000
          $packages = Get-ChildItem -LiteralPath .\artifacts\runtime-nupkg -Filter *.nupkg
          foreach ($package in $packages) {
            if ($package.Length -ge $maxBytes) {
              $actualMb = [Math]::Round($package.Length / 1MB, 2)
              throw "Runtime package '$($package.Name)' is ${actualMb} MB and exceeds the GitHub NuGet registry limit (< 2.147 GB). Split the runtime package before publishing."
            }
          }

          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot .\artifacts\runtime-nupkg `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 3600 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 30 `
            -SortMode size-ascending

      - name: Publish Windows split runtime packages to GitHub Packages
        if: ${{ inputs.publish_to_github_packages && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot .\artifacts\runtime-split-nupkg `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 3600 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 30 `
            -Recurse `
            -SortMode size-ascending
