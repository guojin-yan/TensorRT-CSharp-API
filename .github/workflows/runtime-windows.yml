name: runtime-windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: "win-x64-trt8.6-cuda11.8-cudnn8.9,win-x64-trt8.6-cuda12.1-cudnn8.9,win-x64-trt10.11-cuda11.8-cudnn8.9,win-x64-trt10.11-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda13.2-cudnn9.22"
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: split
        type: string
      split_package_roles:
        description: Must be bridge; NVIDIA runtime package roles are retired
        required: false
        default: bridge
        type: string
      meta_package_version:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      bridge_package_version:
        description: Optional bridge split package version override
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_version_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      include_meta_package:
        description: Retired compatibility input; must remain false
        required: false
        default: false
        type: boolean
      skip_consumer_validation:
        description: Skip split runtime package consumer validation
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: true
        type: boolean
      smoke_runtime_keys:
        description: Optional comma-separated runtime keys that should run smoke
        required: false
        default: "win-x64-trt8.6-cuda11.8-cudnn8.9,win-x64-trt8.6-cuda12.1-cudnn8.9,win-x64-trt11.0-cuda12.9-cudnn9.22"
        type: string
      sign_consumer_output:
        description: Sign consumer output before smoke on the self-hosted runner
        required: false
        default: true
        type: boolean
      publish_to_github_packages:
        description: Publish bridge packages to GitHub Packages
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional GitHub Release tag for direct asset upload
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload bridge packages as GitHub Release assets
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: ""
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: split
        type: string
      split_package_roles:
        description: Must be bridge; NVIDIA runtime package roles are retired
        required: false
        default: bridge
        type: string
      meta_package_version:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      bridge_package_version:
        description: Optional bridge split package version override
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_version_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag_map:
        description: Retired compatibility input; must stay empty
        required: false
        default: ""
        type: string
      include_meta_package:
        description: Retired compatibility input; must remain false
        required: false
        default: false
        type: boolean
      skip_consumer_validation:
        description: Skip split runtime package consumer validation
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: true
        type: boolean
      smoke_runtime_keys:
        description: Optional comma-separated runtime keys that should run smoke
        required: false
        default: ""
        type: string
      sign_consumer_output:
        description: Sign consumer output before smoke on the self-hosted runner
        required: false
        default: true
        type: boolean
      publish_to_github_packages:
        description: Publish bridge packages to GitHub Packages
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional GitHub Release tag for direct asset upload
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload bridge packages as GitHub Release assets
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  pack-runtime:
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - name: Prepare Windows runner
        shell: pwsh
        run: |
          git config --global core.longpaths true
          $workspace = if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKSPACE)) { (Get-Location).Path } else { $env:GITHUB_WORKSPACE }
          $stalePaths = @(
            (Join-Path $workspace 'artifacts\runtime'),
            (Join-Path $workspace 'artifacts\runtime-split'),
            (Join-Path $workspace 'build-out'),
            (Join-Path $env:SystemDrive 'jyppx-pkgcache'),
            (Join-Path $env:RUNNER_TEMP 'jyppx-split-packages')
          )

          foreach ($path in $stalePaths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Removed stale runtime workspace path: $path"
            }
          }

          $globalPackages = dotnet nuget locals global-packages --list |
            ForEach-Object { ($_ -split ':', 2)[1].Trim() } |
            Select-Object -First 1
          if (-not [string]::IsNullOrWhiteSpace($globalPackages) -and (Test-Path -LiteralPath $globalPackages)) {
            Get-ChildItem -LiteralPath $globalPackages -Directory -Filter 'jyppx.tensorrt.csharp.api.runtime*' -ErrorAction SilentlyContinue |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Pruned JYPPX runtime packages from global NuGet cache: $globalPackages"
          }

          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,Root,@{Name='FreeGB';Expression={[math]::Round($_.Free/1GB,2)}} |
            Format-Table -AutoSize

      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce bridge-only packaging policy
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 -StaticOnly
          if ('${{ inputs.runtime_delivery_mode }}' -ne 'split') {
            throw "runtime_delivery_mode must be 'split'; full-runtime packaging is retired."
          }
          if ('${{ inputs.split_package_roles }}'.Trim().ToLowerInvariant() -ne 'bridge') {
            throw "split_package_roles must be 'bridge'; NVIDIA runtime package roles are retired."
          }
          if ('${{ inputs.include_meta_package }}' -eq 'true') {
            throw "include_meta_package is retired. Publish bridge packages only."
          }
          $retiredInputs = @(
            '${{ inputs.meta_package_version }}',
            '${{ inputs.cuda_cudnn_package_version }}',
            '${{ inputs.cuda_cudnn_package_version_map }}',
            '${{ inputs.cuda_cudnn_package_release_tag }}',
            '${{ inputs.cuda_cudnn_package_release_tag_map }}',
            '${{ inputs.tensorrt_package_version }}',
            '${{ inputs.tensorrt_package_version_map }}',
            '${{ inputs.tensorrt_package_release_tag }}',
            '${{ inputs.tensorrt_package_release_tag_map }}'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($retiredInputs.Count -gt 0) {
            throw "Vendor and meta package version/release inputs are retired and must stay empty."
          }
          if ('${{ github.repository_owner }}' -ne 'guojin-yan' -and
              ('${{ inputs.publish_to_github_packages }}' -eq 'true' -or '${{ inputs.attach_to_github_release }}' -eq 'true')) {
            throw "The grape-yan repository is validation-only and cannot publish packages or Release assets."
          }

      - name: Verify local .NET
        shell: pwsh
        run: dotnet --info

      - name: Verify local CMake
        shell: pwsh
        run: cmake --version

      - name: Restore solution
        run: dotnet restore TensorRtSharp.sln

      - name: Validate runtime manifest
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\eng\Validate-RuntimeManifest.ps1

      - name: Validate binding generator outputs
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\eng\Test-BindingGeneratorOutputs.ps1

      - name: Build solution
        run: dotnet build TensorRtSharp.sln -c "${{ inputs.configuration }}" --no-restore

      - name: Test first release core package contracts
        run: dotnet test .\tests\JYPPX.ProjectQuality.Tests\JYPPX.ProjectQuality.Tests.csproj -c "${{ inputs.configuration }}" --no-build --filter "FullyQualifiedName~RuntimeManifestTests|FullyQualifiedName~ManagedPackageTests|FullyQualifiedName~ExternalVendorRuntimePackagePolicyTests|FullyQualifiedName~BridgePackageConsumerTests|FullyQualifiedName~YoloVisionManagedPackagePublicationTests|FullyQualifiedName~ReleaseAutomationTests|FullyQualifiedName~ReleaseQualityGateWorkflowTests"

      - name: Ensure GitHub Release exists
        if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = '${{ inputs.release_tag }}'
          gh release view $tag --repo "$env:GH_REPO" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            return
          }

          Write-Host "Creating release $tag before runtime asset upload."
          gh release create $tag --title $tag --notes "Automated runtime release for $tag" --repo "$env:GH_REPO"
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub Release '$tag' with exit code $LASTEXITCODE."
          }

      - name: Retired full-runtime packages
        if: ${{ false }}
        shell: pwsh
        run: |
          $arguments = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', '.\eng\Invoke-LocalRuntimePackage.ps1',
            '-RuntimePackageKey', '${{ inputs.runtime_keys }}',
            '-Version', '${{ inputs.version }}',
            '-Configuration', '${{ inputs.configuration }}'
          )
          if ('${{ inputs.run_smoke }}' -eq 'true') {
            $arguments += '-RunSmoke'
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.smoke_runtime_keys }}')) {
              $arguments += @('-SmokeRuntimePackageKey', '${{ inputs.smoke_runtime_keys }}')
            }
            if ('${{ inputs.sign_consumer_output }}' -eq 'true') {
              $arguments += '-SignConsumerOutput'
              $arguments += '-TrustConsumerSigningCertificate'
              $arguments += '-TrustConsumerSigningCertificateRoot'
            }
          }
          powershell @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Invoke-LocalRuntimePackage.ps1 failed with exit code $LASTEXITCODE."
          }

      - name: Build bridge packages
        if: ${{ inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $keys = @()
          foreach ($part in '${{ inputs.runtime_keys }}' -split '[,;]') {
            $trimmed = $part.Trim()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $keys += $trimmed
            }
          }
          $smokeKeys = @()
          foreach ($part in '${{ inputs.smoke_runtime_keys }}' -split '[,;]') {
            $trimmed = $part.Trim()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $smokeKeys += $trimmed
            }
          }
          $roleText = '${{ inputs.split_package_roles }}'
          $roleTokens = @()
          foreach ($part in $roleText -split '[,;]') {
            $trimmed = $part.Trim().ToLowerInvariant()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $roleTokens += $trimmed
            }
          }
          $shouldResolvePublishedPackages = (
            '${{ inputs.include_meta_package }}' -eq 'true' -or
            $roleTokens -contains 'all' -or
            $roleTokens -contains 'meta' -or
            $roleTokens -contains 'collection'
          )
          if ($shouldResolvePublishedPackages -and
              -not ($roleTokens -contains 'all') -and
              -not ($roleTokens -contains 'cuda-cudnn') -and
              -not ($roleTokens -contains 'stable-dependencies') -and
              -not ($roleTokens -contains 'nvidia-dependencies') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version_map }}')) {
            throw "split_package_roles includes collection/meta but no CUDA/cuDNN package version was provided. Pass cuda_cudnn_package_version or cuda_cudnn_package_version_map to reuse published CudaCudnn packages, or include cuda-cudnn/all in split_package_roles for a dependency refresh."
          }
          if ($shouldResolvePublishedPackages -and
              -not ($roleTokens -contains 'all') -and
              -not ($roleTokens -contains 'tensorrt') -and
              -not ($roleTokens -contains 'stable-dependencies') -and
              -not ($roleTokens -contains 'nvidia-dependencies') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version_map }}')) {
            throw "split_package_roles includes collection/meta but no TensorRT package version was provided. Pass tensorrt_package_version or tensorrt_package_version_map to reuse published TensorRT component packages, or include tensorrt/all in split_package_roles for a dependency refresh."
          }

          foreach ($key in ($keys | Select-Object -Unique)) {
            $arguments = @(
              '-NoProfile',
              '-ExecutionPolicy', 'Bypass',
              '-File', '.\eng\Invoke-LocalSplitRuntimePackage.ps1',
              '-SourceRuntimeKey', $key,
              '-Version', '${{ inputs.version }}',
              '-SplitPackageRole', '${{ inputs.split_package_roles }}',
              '-Configuration', '${{ inputs.configuration }}'
            )
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.meta_package_version }}')) {
              $arguments += @('-MetaPackageVersion', '${{ inputs.meta_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.bridge_package_version }}')) {
              $arguments += @('-BridgePackageVersion', '${{ inputs.bridge_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}')) {
              $arguments += @('-CudaCudnnPackageVersion', '${{ inputs.cuda_cudnn_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version_map }}')) {
              $arguments += @('-CudaCudnnPackageVersionMap', '${{ inputs.cuda_cudnn_package_version_map }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}')) {
              $arguments += @('-TensorRtPackageVersion', '${{ inputs.tensorrt_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version_map }}')) {
              $arguments += @('-TensorRtPackageVersionMap', '${{ inputs.tensorrt_package_version_map }}')
            }
            if ('${{ inputs.include_meta_package }}' -eq 'true') {
              $arguments += '-IncludeMetaPackage'
            }
            if ('${{ inputs.skip_consumer_validation }}' -eq 'true') {
              $arguments += '-SkipConsumerValidation'
            }
            if ($shouldResolvePublishedPackages) {
              $additionalPackageSources = New-Object System.Collections.Generic.List[string]
              $safeKey = $key -replace '[^A-Za-z0-9._-]', '-'
              $publishedPackageSourceFile = Join-Path $env:RUNNER_TEMP "jyppx-published-package-source-$safeKey.txt"
              $restoreArguments = @(
                '-NoProfile',
                '-ExecutionPolicy', 'Bypass',
                '-File', '.\eng\Restore-PublishedSplitPackageSource.ps1',
                '-SourceRuntimeKey', $key,
                '-SplitPackageRole', '${{ inputs.split_package_roles }}',
                '-Version', '${{ inputs.version }}',
                '-Repository', "$env:GH_REPO",
                '-OutputPathFile', $publishedPackageSourceFile
              )
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.bridge_package_version }}')) {
                $restoreArguments += @('-BridgePackageVersion', '${{ inputs.bridge_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}')) {
                $restoreArguments += @('-CudaCudnnPackageVersion', '${{ inputs.cuda_cudnn_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version_map }}')) {
                $restoreArguments += @('-CudaCudnnPackageVersionMap', '${{ inputs.cuda_cudnn_package_version_map }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_release_tag }}')) {
                $restoreArguments += @('-CudaCudnnPackageReleaseTag', '${{ inputs.cuda_cudnn_package_release_tag }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_release_tag_map }}')) {
                $restoreArguments += @('-CudaCudnnPackageReleaseTagMap', '${{ inputs.cuda_cudnn_package_release_tag_map }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}')) {
                $restoreArguments += @('-TensorRtPackageVersion', '${{ inputs.tensorrt_package_version }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version_map }}')) {
                $restoreArguments += @('-TensorRtPackageVersionMap', '${{ inputs.tensorrt_package_version_map }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_release_tag }}')) {
                $restoreArguments += @('-TensorRtPackageReleaseTag', '${{ inputs.tensorrt_package_release_tag }}')
              }
              if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_release_tag_map }}')) {
                $restoreArguments += @('-TensorRtPackageReleaseTagMap', '${{ inputs.tensorrt_package_release_tag_map }}')
              }

              powershell @restoreArguments
              if ($LASTEXITCODE -ne 0) {
                throw "Restore-PublishedSplitPackageSource.ps1 failed for runtime key '$key' with exit code $LASTEXITCODE."
              }

              $publishedPackageSource = if (Test-Path -LiteralPath $publishedPackageSourceFile -PathType Leaf) {
                (Get-Content -LiteralPath $publishedPackageSourceFile -Raw).Trim()
              }
              else {
                ""
              }

              if (-not [string]::IsNullOrWhiteSpace($publishedPackageSource)) {
                $additionalPackageSources.Add($publishedPackageSource)
              }
              $additionalPackageSources.Add('https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json')

              $arguments += @(
                '-AdditionalPackageSource',
                ($additionalPackageSources -join ','),
                '-AdditionalPackageSourceUsername',
                '${{ github.actor }}',
                '-AdditionalPackageSourcePassword',
                '${{ github.token }}'
              )
            }
            $shouldRunSmoke = ('${{ inputs.run_smoke }}' -eq 'true') -and ($smokeKeys.Count -eq 0 -or $smokeKeys -contains $key)
            if ($shouldRunSmoke) {
              $arguments += '-RunSmoke'
              if ('${{ inputs.sign_consumer_output }}' -eq 'true') {
                $arguments += '-SignConsumerOutput'
                $arguments += '-TrustConsumerSigningCertificate'
                $arguments += '-TrustConsumerSigningCertificateRoot'
              }
            }
            powershell @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Invoke-LocalSplitRuntimePackage.ps1 failed for runtime key '$key' with exit code $LASTEXITCODE."
            }

            pwsh -NoProfile -ExecutionPolicy Bypass -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 `
              -PackagePath (Join-Path '.\artifacts\runtime-split-nupkg' $key)

            if ('${{ inputs.attach_to_github_release }}' -eq 'true' -and -not [string]::IsNullOrWhiteSpace('${{ inputs.release_tag }}')) {
              $splitPackageRoot = Join-Path '.\artifacts\runtime-split-nupkg' $key
              $packages = @(Get-ChildItem -LiteralPath $splitPackageRoot -Filter *.nupkg -Recurse | Sort-Object FullName)
              if ($packages.Count -eq 0) {
                throw "No Windows split runtime packages were found for runtime key '$key' under '$splitPackageRoot'."
              }

              foreach ($package in $packages) {
                Write-Host "Uploading release asset for ${key}: $($package.FullName)"
                gh release upload "${{ inputs.release_tag }}" $package.FullName --clobber --repo "$env:GH_REPO"
                if ($LASTEXITCODE -ne 0) {
                  throw "gh release upload failed for '$($package.FullName)' with exit code $LASTEXITCODE."
                }
              }

              if ('${{ inputs.publish_to_github_packages }}' -ne 'true') {
                Remove-Item -LiteralPath $splitPackageRoot -Recurse -Force -ErrorAction SilentlyContinue
                Write-Host "Pruned uploaded split runtime package directory: $splitPackageRoot"
              }
            }
          }

      - name: Prune Windows runtime intermediates
        if: ${{ always() }}
        shell: pwsh
        run: |
          $paths = @(
            '.\artifacts\runtime',
            '.\artifacts\runtime-split',
            '.\build-out',
            (Join-Path $env:SystemDrive 'jyppx-pkgcache'),
            (Join-Path $env:RUNNER_TEMP 'jyppx-split-packages')
          )

          foreach ($path in $paths) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "Pruned $path"
            }
          }

          foreach ($root in @('.\pack\runtime', '.\pack\runtime-split')) {
            if (-not (Test-Path -LiteralPath $root)) {
              continue
            }

            foreach ($directory in Get-ChildItem -LiteralPath $root -Directory) {
              foreach ($child in @('assets', 'bin', 'obj')) {
                $candidate = Join-Path $directory.FullName $child
                if (Test-Path -LiteralPath $candidate) {
                  Remove-Item -LiteralPath $candidate -Recurse -Force -ErrorAction SilentlyContinue
                  Write-Host "Pruned $candidate"
                }
              }
            }
          }

          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name,Root,@{Name='FreeGB';Expression={[math]::Round($_.Free/1GB,2)}} |
            Format-Table -AutoSize

      - name: Upload Windows runtime artifacts
        if: ${{ false }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: runtime-windows-full
          path: |
            artifacts/managed/*.nupkg
            artifacts/runtime-nupkg/*.nupkg
            artifacts/package-consumer/package-consumer-validation-summary.*
            artifacts/local-runtime-validation/*.json
            artifacts/local-runtime-validation/*.md

      - name: Upload Windows split runtime artifacts
        if: ${{ inputs.attach_to_github_release && inputs.release_tag == '' && inputs.runtime_delivery_mode == 'split' }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: runtime-windows-split
          path: |
            artifacts/managed/*.nupkg
            artifacts/runtime-split-nupkg/**/*.nupkg
            artifacts/package-consumer/package-consumer-validation-summary.*
            artifacts/local-runtime-validation/*.json
            artifacts/local-runtime-validation/*.md

      - name: Retired Windows full-runtime Release upload
        if: ${{ false }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath .\artifacts\runtime-nupkg -Filter *.nupkg | Sort-Object Name)
          if ($packages.Count -eq 0) {
            throw "No Windows runtime packages were found for direct release upload."
          }

          foreach ($package in $packages) {
            Write-Host "Uploading release asset: $($package.FullName)"
            gh release upload "${{ inputs.release_tag }}" $package.FullName --clobber --repo "$env:GH_REPO"
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed for '$($package.FullName)' with exit code $LASTEXITCODE."
            }
          }

      - name: Upload Windows bridge packages to GitHub Release
        if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          Write-Host "Windows split runtime packages are uploaded immediately after each runtime key is packaged."
          Write-Host "Skipping the final bulk upload to avoid duplicate large release asset transfers."
          return

          $packages = @(Get-ChildItem -LiteralPath .\artifacts\runtime-split-nupkg -Filter *.nupkg -Recurse | Sort-Object FullName)
          if ($packages.Count -eq 0) {
            Write-Host "No remaining Windows split runtime packages were found; direct split release assets may have already been uploaded after each runtime key."
            return
          }

          foreach ($package in $packages) {
            Write-Host "Uploading release asset: $($package.FullName)"
            gh release upload "${{ inputs.release_tag }}" $package.FullName --clobber --repo "$env:GH_REPO"
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed for '$($package.FullName)' with exit code $LASTEXITCODE."
            }
          }

      - name: Retired Windows full-runtime GitHub Packages publish
        if: ${{ false }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $maxBytes = 2147000000
          $packages = Get-ChildItem -LiteralPath .\artifacts\runtime-nupkg -Filter *.nupkg
          foreach ($package in $packages) {
            if ($package.Length -ge $maxBytes) {
              $actualMb = [Math]::Round($package.Length / 1MB, 2)
              throw "Runtime package '$($package.Name)' is ${actualMb} MB and exceeds the GitHub NuGet registry limit (< 2.147 GB). Split the runtime package before publishing."
            }
          }

          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot .\artifacts\runtime-nupkg `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 3600 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 30 `
            -SortMode size-ascending

      - name: Publish Windows bridge packages to GitHub Packages
        if: ${{ inputs.publish_to_github_packages && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot .\artifacts\runtime-split-nupkg `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 3600 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 30 `
            -Recurse `
            -SortMode size-ascending
