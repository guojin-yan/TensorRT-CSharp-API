name: package-managed

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0-preview.1
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      owner_publish_approved:
        description: Explicit Owner approval for package or Release publication side effects
        required: false
        default: false
        type: boolean
      publish_to_nuget:
        description: Publish package to nuget.org
        required: false
        default: false
        type: boolean
      publish_to_github_packages:
        description: Publish package to GitHub Packages
        required: false
        default: false
        type: boolean
      artifact_name:
        description: Uploaded artifact name
        required: false
        default: managed-packages
        type: string
      release_tag:
        description: Optional GitHub Release tag for managed package assets
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload managed package assets to the GitHub Release
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0-preview.1
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      owner_publish_approved:
        description: Explicit Owner approval for package or Release publication side effects
        required: false
        default: false
        type: boolean
      publish_to_nuget:
        description: Publish package to nuget.org
        required: false
        default: false
        type: boolean
      publish_to_github_packages:
        description: Publish package to GitHub Packages
        required: false
        default: false
        type: boolean
      artifact_name:
        description: Uploaded artifact name
        required: false
        default: managed-packages
        type: string
      release_tag:
        description: Optional GitHub Release tag for managed package assets
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload managed package assets to the GitHub Release
        required: false
        default: false
        type: boolean
    secrets:
      NUGET_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  pack:
    runs-on: windows-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce package publication policy
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 -StaticOnly
          $hasPublicationSideEffect = '${{ inputs.publish_to_nuget }}' -eq 'true' -or
            '${{ inputs.publish_to_github_packages }}' -eq 'true' -or
            '${{ inputs.attach_to_github_release }}' -eq 'true'
          if ($hasPublicationSideEffect -and '${{ github.repository_owner }}' -ne 'guojin-yan') {
            throw "The grape-yan repository is validation-only and cannot publish packages or Release assets."
          }
          if ($hasPublicationSideEffect -and '${{ inputs.owner_publish_approved }}' -ne 'true') {
            throw "Package or Release publication requires owner_publish_approved=true."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $value = pwsh -NoProfile -File .\eng\Resolve-PackageVersion.ps1 -RequestedVersion "${{ inputs.version }}"
          "package_version=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate nuget.org publish prerequisites
        if: ${{ inputs.publish_to_nuget }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          pwsh -NoProfile -File .\eng\Test-PublishPrerequisites.ps1 `
            -Target nuget.org `
            -ApiKey $env:NUGET_API_KEY

      - name: Restore solution
        run: dotnet restore TensorRtSharp.sln

      - name: Validate runtime manifest
        run: pwsh -NoProfile -File .\eng\Validate-RuntimeManifest.ps1

      - name: Validate binding generator outputs
        run: pwsh -NoProfile -File .\eng\Test-BindingGeneratorOutputs.ps1

      - name: Build solution
        run: dotnet build TensorRtSharp.sln -c "${{ inputs.configuration }}" --no-restore

      - name: Validate public API bilingual documentation
        run: pwsh -NoProfile -File .\eng\Test-PublicApiBilingualDocumentation.ps1

      - name: Test managed package publication contracts
        run: dotnet test .\tests\JYPPX.ProjectQuality.Tests\JYPPX.ProjectQuality.Tests.csproj -c "${{ inputs.configuration }}" --no-build --filter "FullyQualifiedName~ExternalVendorRuntimePackagePolicyTests|FullyQualifiedName~PublicationLicenseReadinessTests|FullyQualifiedName~YoloVisionManagedPackagePublicationTests|FullyQualifiedName~YoloVisionLocalPackageConsumerTests|FullyQualifiedName~ReleaseAutomationTests|FullyQualifiedName~ReleaseQualityGateWorkflowTests"

      - name: Pack managed package
        run: dotnet pack .\pack\JYPPX.TensorRT.CSharp.API\JYPPX.TensorRT.CSharp.API.csproj -c "${{ inputs.configuration }}" -o .\artifacts\managed -p:JYPPXPackageVersion=${{ steps.version.outputs.package_version }} -p:RepositoryCommit=${{ github.sha }} -p:ContinuousIntegrationBuild=true

      - name: Validate exact managed package set
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.package_version }}'
          $managedPath = ".\artifacts\managed\JYPPX.TensorRT.CSharp.API.$version.nupkg"
          pwsh -NoProfile -File .\eng\Test-ManagedPackageContent.ps1 -PackagePath $managedPath
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 `
            -PackagePath .\artifacts\managed `
            -ExpectedPackageId 'JYPPX.TensorRT.CSharp.API' `
            -ExpectedPackageVersion $version `
            -RequireExactPackageSet

      - name: Upload managed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/managed/*.nupkg

  attach-github-release:
    if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' && inputs.owner_publish_approved && github.repository_owner == 'guojin-yan' }}
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download managed package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/managed

      - name: Revalidate Release package allowlist
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 `
            -PackagePath .\artifacts\managed `
            -ExpectedPackageId 'JYPPX.TensorRT.CSharp.API' `
            -ExpectedPackageVersion '${{ needs.pack.outputs.package_version }}' `
            -RequireExactPackageSet
          pwsh -NoProfile -File .\eng\Test-PublicationLicenseReadiness.ps1 `
            -ArtifactPath .\artifacts\managed

      - name: Attach managed packages to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseTag = "${{ inputs.release_tag }}"
          $packages = @(Get-ChildItem -LiteralPath .\artifacts\managed -Filter *.nupkg -File)
          if ($packages.Count -ne 1 -or $packages[0].BaseName -notlike 'JYPPX.TensorRT.CSharp.API.*') {
            throw "Expected exactly one core managed .nupkg file, found $($packages.Name -join ', ')."
          }
          gh release view $releaseTag --repo "$env:GH_REPO" *> $null
          if ($LASTEXITCODE -ne 0) {
            $releaseArguments = @(
              "release", "create", $releaseTag,
              "--title", $releaseTag,
              "--notes", "Automated release for $releaseTag",
              "--repo", "$env:GH_REPO"
            )
            if ($releaseTag.Contains("-")) {
              $releaseArguments += "--prerelease"
            }
            gh @releaseArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release '$releaseTag'."
            }
          }
          foreach ($package in $packages) {
            gh release upload $releaseTag $package.FullName --clobber --repo "$env:GH_REPO"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload managed package '$($package.Name)' to GitHub Release '$releaseTag'."
            }
          }

  publish-github-packages:
    if: ${{ inputs.publish_to_github_packages && inputs.owner_publish_approved && github.repository_owner == 'guojin-yan' }}
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download managed package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/managed

      - name: Revalidate GitHub Packages payload
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 `
            -PackagePath .\artifacts\managed `
            -ExpectedPackageId 'JYPPX.TensorRT.CSharp.API' `
            -ExpectedPackageVersion '${{ needs.pack.outputs.package_version }}' `
            -RequireExactPackageSet

      - name: Publish managed package to GitHub Packages
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot .\artifacts\managed `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 1800 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 15

  publish-nuget:
    if: ${{ inputs.publish_to_nuget && inputs.owner_publish_approved && github.repository_owner == 'guojin-yan' }}
    needs: pack
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Validate nuget.org publish prerequisites
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          pwsh -NoProfile -File .\eng\Test-PublishPrerequisites.ps1 `
            -Target nuget.org `
            -ApiKey $env:NUGET_API_KEY

      - name: Download managed package artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact_name }}
          path: artifacts/managed

      - name: Revalidate nuget.org payload
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 `
            -PackagePath .\artifacts\managed `
            -ExpectedPackageId 'JYPPX.TensorRT.CSharp.API' `
            -ExpectedPackageVersion '${{ needs.pack.outputs.package_version }}' `
            -RequireExactPackageSet

      - name: Publish managed package to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          Write-Host "Using NUGET_API_KEY secret for nuget.org publication."

          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot .\artifacts\managed `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKeyEnvironmentVariable NUGET_API_KEY `
            -TimeoutSeconds 1800 `
            -MaxAttempts 2 `
            -RetryDelaySeconds 15
