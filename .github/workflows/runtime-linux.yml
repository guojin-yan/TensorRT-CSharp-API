name: runtime-linux

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Linux runtime keys
        required: false
        default: ""
        type: string
      runtime_key_set:
        description: Linux runtime key set when runtime_keys is empty
        required: false
        default: auto
        type: string
      runner_mode:
        description: Linux runner mode
        required: false
        default: hosted
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: split
        type: string
      split_package_roles:
        description: Must be bridge; NVIDIA runtime package roles are retired
        required: false
        default: bridge
        type: string
      meta_package_version:
        description: Optional split meta package version override
        required: false
        default: ""
        type: string
      bridge_package_version:
        description: Optional bridge split package version override
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version_map:
        description: Optional runtime-key map for already-published CUDA/cuDNN split package versions
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag_map:
        description: Optional runtime-key map for CUDA/cuDNN split package release tags
        required: false
        default: ""
        type: string
      tensorrt_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_version_map:
        description: Optional runtime-key map for already-published TensorRT split package versions
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag_map:
        description: Optional runtime-key map for TensorRT split package release tags
        required: false
        default: ""
        type: string
      include_meta_package:
        description: Build the split meta package even when only a subset of roles is selected
        required: false
        default: false
        type: boolean
      skip_consumer_validation:
        description: Skip split runtime package consumer validation
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: false
        type: boolean
      publish_to_github_packages:
        description: Publish bridge packages to GitHub Packages
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional GitHub Release tag for direct asset upload
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload bridge packages as GitHub Release assets
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      version:
        description: Package version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      runtime_keys:
        description: Optional comma-separated Linux runtime keys
        required: false
        default: ""
        type: string
      runtime_key_set:
        description: Linux runtime key set when runtime_keys is empty
        required: false
        default: auto
        type: string
      runner_mode:
        description: Linux runner mode
        required: false
        default: hosted
        type: string
      runtime_delivery_mode:
        description: Runtime package layout to produce
        required: false
        default: split
        type: string
      split_package_roles:
        description: Must be bridge; NVIDIA runtime package roles are retired
        required: false
        default: bridge
        type: string
      meta_package_version:
        description: Optional split meta package version override
        required: false
        default: ""
        type: string
      bridge_package_version:
        description: Optional bridge split package version override
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_version_map:
        description: Optional runtime-key map for already-published CUDA/cuDNN split package versions
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      cuda_cudnn_package_release_tag_map:
        description: Optional runtime-key map for CUDA/cuDNN split package release tags
        required: false
        default: ""
        type: string
      tensorrt_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_version_map:
        description: Optional runtime-key map for already-published TensorRT split package versions
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      tensorrt_package_release_tag_map:
        description: Optional runtime-key map for TensorRT split package release tags
        required: false
        default: ""
        type: string
      include_meta_package:
        description: Build the split meta package even when only a subset of roles is selected
        required: false
        default: false
        type: boolean
      skip_consumer_validation:
        description: Skip split runtime package consumer validation
        required: false
        default: false
        type: boolean
      run_smoke:
        description: Run package consumer smoke after packing
        required: false
        default: false
        type: boolean
      publish_to_github_packages:
        description: Publish bridge packages to GitHub Packages
        required: false
        default: false
        type: boolean
      release_tag:
        description: Optional GitHub Release tag for direct asset upload
        required: false
        default: ""
        type: string
      attach_to_github_release:
        description: Upload bridge packages as GitHub Release assets
        required: false
        default: true
        type: boolean
permissions:
  contents: write
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      matrix: ${{ steps.matrix.outputs.value }}
      has_entries: ${{ steps.matrix.outputs.has_entries }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enforce bridge-only packaging policy
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./eng/Test-ExternalVendorRuntimePackagePolicy.ps1 -StaticOnly
          if ('${{ inputs.runtime_delivery_mode }}' -ne 'split') {
            throw "runtime_delivery_mode must be 'split'; full-runtime packaging is retired."
          }
          if ('${{ inputs.split_package_roles }}'.Trim().ToLowerInvariant() -ne 'bridge') {
            throw "split_package_roles must be 'bridge'; NVIDIA runtime package roles are retired."
          }
          if ('${{ inputs.include_meta_package }}' -eq 'true') {
            throw "include_meta_package is retired. Publish bridge packages only."
          }
          $retiredInputs = @(
            '${{ inputs.meta_package_version }}',
            '${{ inputs.cuda_cudnn_package_version }}',
            '${{ inputs.cuda_cudnn_package_version_map }}',
            '${{ inputs.cuda_cudnn_package_release_tag }}',
            '${{ inputs.cuda_cudnn_package_release_tag_map }}',
            '${{ inputs.tensorrt_package_version }}',
            '${{ inputs.tensorrt_package_version_map }}',
            '${{ inputs.tensorrt_package_release_tag }}',
            '${{ inputs.tensorrt_package_release_tag_map }}'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($retiredInputs.Count -gt 0) {
            throw "Vendor and meta package version/release inputs are retired and must stay empty."
          }
          if ('${{ github.repository_owner }}' -ne 'guojin-yan' -and
              ('${{ inputs.publish_to_github_packages }}' -eq 'true' -or '${{ inputs.attach_to_github_release }}' -eq 'true')) {
            throw "The grape-yan repository is validation-only and cannot publish packages or Release assets."
          }

      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $value = pwsh -NoProfile -File .\eng\Resolve-PackageVersion.ps1 -RequestedVersion "${{ inputs.version }}"
          "package_version=$value" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve Linux runtime matrix
        id: matrix
        shell: pwsh
        run: |
          $requestedKeys = pwsh -NoProfile -File .\eng\Resolve-RuntimeKeySet.ps1 -Platform linux -RuntimeKey "${{ inputs.runtime_keys }}" -RuntimeKeySet "${{ inputs.runtime_key_set }}" -RunnerMode "${{ inputs.runner_mode }}"
          if ([string]::IsNullOrWhiteSpace($requestedKeys)) {
            "value={""include"":[]}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            "has_entries=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            Write-Host "No Linux runtime keys were requested. The Linux runtime module will no-op."
            exit 0
          }

          $value = pwsh -NoProfile -File .\eng\Resolve-RuntimeMatrix.ps1 -Platform linux -RuntimeKey $requestedKeys -RunnerMode "${{ inputs.runner_mode }}"
          "value={""include"":$value}" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "has_entries=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Ensure GitHub Release exists
        if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $releaseTag = "${{ inputs.release_tag }}"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $releaseTag --repo "$env:GH_REPO" *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not $releaseExists) {
            gh release create $releaseTag --title $releaseTag --notes "Automated Linux runtime release for $releaseTag" --repo "$env:GH_REPO"
          }

  managed:
    needs: prepare
    if: ${{ needs.prepare.outputs.has_entries == 'true' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore solution
        run: dotnet restore TensorRtSharp.sln

      - name: Validate runtime manifest
        run: pwsh -NoProfile -File .\eng\Validate-RuntimeManifest.ps1

      - name: Validate binding generator outputs
        run: pwsh -NoProfile -File .\eng\Test-BindingGeneratorOutputs.ps1

      - name: Build solution
        run: dotnet build TensorRtSharp.sln -c "${{ inputs.configuration }}" --no-restore

      - name: Test project quality
        run: dotnet test .\tests\JYPPX.ProjectQuality.Tests\JYPPX.ProjectQuality.Tests.csproj -c "${{ inputs.configuration }}" --no-build

      - name: Pack managed package
        run: dotnet pack .\pack\JYPPX.TensorRT.CSharp.API\JYPPX.TensorRT.CSharp.API.csproj -c "${{ inputs.configuration }}" -o .\artifacts\managed -p:JYPPXPackageVersion=${{ needs.prepare.outputs.package_version }}

      - name: Validate managed package content
        run: pwsh -NoProfile -File .\eng\Test-ManagedPackageContent.ps1

      - name: Upload managed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: managed-packages-runtime-linux
          path: artifacts/managed/*.nupkg

  pack-runtime:
    needs:
      - prepare
      - managed
    if: ${{ needs.prepare.outputs.has_entries == 'true' }}
    runs-on: ${{ fromJson(matrix.runsOnJson) }}
    container: ${{ matrix.containerImage }}
    env:
      DOTNET_INSTALL_DIR: ${{ github.workspace }}/.dotnet
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Bootstrap Ubuntu container tools
        if: ${{ matrix.containerImage != '' }}
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl wget gnupg apt-transport-https sudo git jq unzip zip tar gzip xz-utils
          . /etc/os-release
          wget -q "https://packages.microsoft.com/config/ubuntu/${VERSION_ID}/packages-microsoft-prod.deb" -O /tmp/packages-microsoft-prod.deb
          dpkg -i /tmp/packages-microsoft-prod.deb
          rm -f /tmp/packages-microsoft-prod.deb
          mkdir -p -m 755 /etc/apt/keyrings
          wget -qO /etc/apt/keyrings/githubcli-archive-keyring.gpg https://cli.github.com/packages/githubcli-archive-keyring.gpg
          chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends powershell gh

      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate hosted runner mode
        if: ${{ inputs.runner_mode == 'hosted' && matrix.runnerMode != 'hosted' }}
        shell: pwsh
        run: throw "Runtime key '${{ matrix.key }}' requires runner_mode='${{ matrix.runnerMode }}', but hosted mode was requested."

      - name: Validate hosted container runner mode
        if: ${{ inputs.runner_mode == 'hosted-container' && matrix.runnerMode != 'hosted-container' }}
        shell: pwsh
        run: throw "Runtime key '${{ matrix.key }}' requires runner_mode='${{ matrix.runnerMode }}', but hosted-container mode was requested."

      - name: Validate self-hosted runner mode
        if: ${{ inputs.runner_mode == 'self-hosted' && matrix.runnerMode != 'self-hosted' }}
        shell: pwsh
        run: throw "Runtime key '${{ matrix.key }}' requires runner_mode='${{ matrix.runnerMode }}', but self-hosted mode was requested."

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Prepare hosted Linux tools
        shell: bash
        run: |
          set -euo pipefail
          CMAKE_VERSION="3.31.8"
          CMAKE_ARCHIVE="cmake-${CMAKE_VERSION}-linux-x86_64.tar.gz"
          CMAKE_URL="https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_ARCHIVE}"
          CMAKE_ROOT="/opt/cmake-${CMAKE_VERSION}"

          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build wget ca-certificates curl tar gzip

          curl --fail --location --retry 5 --retry-delay 5 "$CMAKE_URL" --output "/tmp/${CMAKE_ARCHIVE}"
          sudo rm -rf "$CMAKE_ROOT"
          sudo mkdir -p "$CMAKE_ROOT"
          sudo tar -xzf "/tmp/${CMAKE_ARCHIVE}" --strip-components=1 -C "$CMAKE_ROOT"
          sudo ln -sf "$CMAKE_ROOT/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "$CMAKE_ROOT/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "$CMAKE_ROOT/bin/cpack" /usr/local/bin/cpack

      - name: Verify local .NET
        shell: pwsh
        run: dotnet --info

      - name: Verify local CMake
        shell: pwsh
        run: |
          $versionText = (cmake --version | Select-Object -First 1)
          Write-Host $versionText
          if ($versionText -notmatch 'version\s+(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)') {
            throw "Unable to parse CMake version from '$versionText'."
          }

          $version = [System.Version]::new([int]$Matches.major, [int]$Matches.minor, [int]$Matches.patch)
          $minimum = [System.Version]::new(3, 27, 0)
          if ($version -lt $minimum) {
            throw "CMake $version is too old for CMakePresets.json. CMake $minimum or newer is required."
          }

      - name: Verify GitHub CLI
        shell: pwsh
        run: gh --version

      - name: Prepare NVIDIA dependencies from official apt packages
        if: ${{ matrix.nvidiaDependencyMode == 'apt' }}
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/Prepare-LinuxNvidiaDependencies.ps1 -RuntimePackageKey "${{ matrix.key }}"

      - name: Use preinstalled NVIDIA dependencies
        if: ${{ matrix.nvidiaDependencyMode != 'apt' }}
        shell: pwsh
        run: |
          Write-Host "Skipping apt dependency preparation for ${{ matrix.key }}."
          Write-Host "Runners should provide roots through pack/runtime/runtime-packages.local.json or JYPPX_RUNTIME_PACKAGE_ROOTS_FILE."

      - name: Download managed package artifact
        uses: actions/download-artifact@v8
        with:
          name: managed-packages-runtime-linux
          path: artifacts/managed

      - name: Restore solution
        run: dotnet restore TensorRtSharp.sln

      - name: Resolve runtime roots
        id: roots
        shell: pwsh
        run: |
          $resolved = pwsh -NoProfile -File .\eng\Resolve-RuntimeRoots.ps1 -RuntimePackageKey "${{ matrix.key }}" | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($resolved.tensorRtRoot)) { throw "TensorRT root is not configured for $($resolved.runtimeKey)." }
          if ([string]::IsNullOrWhiteSpace($resolved.cudaRoot)) { throw "CUDA root is not configured for $($resolved.runtimeKey)." }
          "tensor_rt_root=$($resolved.tensorRtRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cuda_root=$($resolved.cudaRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "cudnn_root=$($resolved.cudnnRoot)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Validate Linux runtime inputs
        run: pwsh -NoProfile -File ./eng/Validate-LinuxRuntimeInputs.ps1 -RuntimePackageKey "${{ matrix.key }}" -TensorRtRoot "${{ steps.roots.outputs.tensor_rt_root }}" -CudaRoot "${{ steps.roots.outputs.cuda_root }}" -CudnnRoot "${{ steps.roots.outputs.cudnn_root }}"

      - name: Configure native bridge
        run: cmake --preset "${{ matrix.buildPreset }}" -DJYPPX_TENSORRT_ROOT="${{ steps.roots.outputs.tensor_rt_root }}" -DCUDAToolkit_ROOT="${{ steps.roots.outputs.cuda_root }}" -DJYPPX_CUDA_ROOT="${{ steps.roots.outputs.cuda_root }}" -DJYPPX_CUDNN_ROOT="${{ steps.roots.outputs.cudnn_root }}"

      - name: Build native bridge
        run: cmake --build --preset "${{ matrix.buildPreset }}"

      - name: Create Linux dry-run summary
        run: pwsh -NoProfile -File ./eng/Invoke-LinuxRuntimeDryRun.ps1 -RuntimePackageKey "${{ matrix.key }}" -TensorRtRoot "${{ steps.roots.outputs.tensor_rt_root }}" -CudaRoot "${{ steps.roots.outputs.cuda_root }}"

      - name: Validate Linux dry-run artifacts
        run: pwsh -NoProfile -File ./eng/Validate-LinuxDryRunArtifacts.ps1 -RuntimePackageKey "${{ matrix.key }}"

      - name: Validate Linux workflow contract
        run: pwsh -NoProfile -File ./eng/Test-LinuxRuntimeWorkflowContract.ps1 -RuntimePackageKey "${{ matrix.key }}" -ConfigurePreset "${{ matrix.buildPreset }}" -BuildPreset "${{ matrix.buildPreset }}"

      - name: Export Linux preflight summary
        run: pwsh -NoProfile -File ./eng/Export-LinuxPreflightSummary.ps1 -RuntimePackageKey "${{ matrix.key }}"

      - name: Export Linux package consumer plan
        run: pwsh -NoProfile -File ./eng/Export-LinuxPackageConsumerPlan.ps1 -RuntimePackageKey "${{ matrix.key }}"

      - name: Export Linux runner execution status
        run: pwsh -NoProfile -File ./eng/Export-LinuxRunnerExecutionStatus.ps1 -RuntimePackageKey "${{ matrix.key }}"

      - name: Export Linux handoff index
        run: pwsh -NoProfile -File ./eng/Export-LinuxHandoffIndex.ps1 -RuntimePackageKey "${{ matrix.key }}"

      - name: Retired full-runtime asset collection
        if: ${{ false }}
        run: pwsh -NoProfile -File ./eng/Collect-RuntimeAssets.ps1 -RuntimePackageKey "${{ matrix.key }}" -TensorRtRoot "${{ steps.roots.outputs.tensor_rt_root }}" -CudaRoot "${{ steps.roots.outputs.cuda_root }}" -CudnnRoot "${{ steps.roots.outputs.cudnn_root }}"

      - name: Retired full-runtime package
        if: ${{ false }}
        run: dotnet pack "./pack/runtime/${{ matrix.key }}/${{ matrix.packageId }}.csproj" -c "${{ inputs.configuration }}" -o ./artifacts/runtime-nupkg -p:JYPPXPackageVersion=${{ needs.prepare.outputs.package_version }}

      - name: Retired full-runtime consumer validation
        if: ${{ false }}
        run: pwsh -NoProfile -File ./eng/Test-PackageConsumer.ps1 -RuntimePackageKey "${{ matrix.key }}" -ManagedPackageDirectory "./artifacts/managed" -RuntimePackageDirectory "./artifacts/runtime-nupkg"

      - name: Retired full-runtime consumer smoke
        if: ${{ false }}
        run: pwsh -NoProfile -File ./eng/Test-PackageConsumer.ps1 -RuntimePackageKey "${{ matrix.key }}" -ManagedPackageDirectory "./artifacts/managed" -RuntimePackageDirectory "./artifacts/runtime-nupkg" -RunSmoke

      - name: Pack bridge package
        if: ${{ inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $roleText = '${{ inputs.split_package_roles }}'
          $roleTokens = @()
          foreach ($part in $roleText -split '[,;]') {
            $trimmed = $part.Trim().ToLowerInvariant()
            if (-not [string]::IsNullOrWhiteSpace($trimmed)) {
              $roleTokens += $trimmed
            }
          }

          $shouldResolvePublishedPackages = (
            '${{ inputs.include_meta_package }}' -eq 'true' -or
            $roleTokens -contains 'all' -or
            $roleTokens -contains 'meta' -or
            $roleTokens -contains 'collection'
          )
          if ($shouldResolvePublishedPackages -and
              -not ($roleTokens -contains 'all') -and
              -not ($roleTokens -contains 'cuda-cudnn') -and
              -not ($roleTokens -contains 'stable-dependencies') -and
              -not ($roleTokens -contains 'nvidia-dependencies') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version_map }}')) {
            throw "split_package_roles includes collection/meta but no CUDA/cuDNN package version was provided. Pass cuda_cudnn_package_version or cuda_cudnn_package_version_map to reuse published CudaCudnn packages, or include cuda-cudnn/all in split_package_roles for a dependency refresh."
          }
          if ($shouldResolvePublishedPackages -and
              -not ($roleTokens -contains 'all') -and
              -not ($roleTokens -contains 'tensorrt') -and
              -not ($roleTokens -contains 'stable-dependencies') -and
              -not ($roleTokens -contains 'nvidia-dependencies') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}') -and
              [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version_map }}')) {
            throw "split_package_roles includes collection/meta but no TensorRT package version was provided. Pass tensorrt_package_version or tensorrt_package_version_map to reuse published TensorRT component packages, or include tensorrt/all in split_package_roles for a dependency refresh."
          }

          $arguments = @(
            '-NoProfile',
            '-ExecutionPolicy', 'Bypass',
            '-File', './eng/Invoke-LocalSplitRuntimePackage.ps1',
            '-SourceRuntimeKey', '${{ matrix.key }}',
            '-Version', '${{ needs.prepare.outputs.package_version }}',
            '-SplitPackageRole', '${{ inputs.split_package_roles }}',
            '-Configuration', '${{ inputs.configuration }}',
            '-SkipManagedPack',
            '-SkipBaseRuntimeBuild'
          )

          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.meta_package_version }}')) {
            $arguments += @('-MetaPackageVersion', '${{ inputs.meta_package_version }}')
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.bridge_package_version }}')) {
            $arguments += @('-BridgePackageVersion', '${{ inputs.bridge_package_version }}')
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}')) {
            $arguments += @('-CudaCudnnPackageVersion', '${{ inputs.cuda_cudnn_package_version }}')
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version_map }}')) {
            $arguments += @('-CudaCudnnPackageVersionMap', '${{ inputs.cuda_cudnn_package_version_map }}')
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}')) {
            $arguments += @('-TensorRtPackageVersion', '${{ inputs.tensorrt_package_version }}')
          }
          if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version_map }}')) {
            $arguments += @('-TensorRtPackageVersionMap', '${{ inputs.tensorrt_package_version_map }}')
          }
          if ('${{ inputs.include_meta_package }}' -eq 'true') {
            $arguments += '-IncludeMetaPackage'
          }
          if ('${{ inputs.skip_consumer_validation }}' -eq 'true') {
            $arguments += '-SkipConsumerValidation'
          }
          if ('${{ inputs.run_smoke }}' -eq 'true') {
            $arguments += '-RunSmoke'
          }
          if ($shouldResolvePublishedPackages) {
            $additionalPackageSources = New-Object System.Collections.Generic.List[string]
            $safeKey = '${{ matrix.key }}' -replace '[^A-Za-z0-9._-]', '-'
            $publishedPackageSourceFile = Join-Path $env:RUNNER_TEMP "jyppx-published-package-source-$safeKey.txt"
            $restoreArguments = @(
              '-NoProfile',
              '-ExecutionPolicy', 'Bypass',
              '-File', './eng/Restore-PublishedSplitPackageSource.ps1',
              '-SourceRuntimeKey', '${{ matrix.key }}',
              '-SplitPackageRole', '${{ inputs.split_package_roles }}',
              '-Version', '${{ needs.prepare.outputs.package_version }}',
              '-Repository', "$env:GH_REPO",
              '-OutputPathFile', $publishedPackageSourceFile
            )
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.bridge_package_version }}')) {
              $restoreArguments += @('-BridgePackageVersion', '${{ inputs.bridge_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version }}')) {
              $restoreArguments += @('-CudaCudnnPackageVersion', '${{ inputs.cuda_cudnn_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_version_map }}')) {
              $restoreArguments += @('-CudaCudnnPackageVersionMap', '${{ inputs.cuda_cudnn_package_version_map }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_release_tag }}')) {
              $restoreArguments += @('-CudaCudnnPackageReleaseTag', '${{ inputs.cuda_cudnn_package_release_tag }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.cuda_cudnn_package_release_tag_map }}')) {
              $restoreArguments += @('-CudaCudnnPackageReleaseTagMap', '${{ inputs.cuda_cudnn_package_release_tag_map }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version }}')) {
              $restoreArguments += @('-TensorRtPackageVersion', '${{ inputs.tensorrt_package_version }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_version_map }}')) {
              $restoreArguments += @('-TensorRtPackageVersionMap', '${{ inputs.tensorrt_package_version_map }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_release_tag }}')) {
              $restoreArguments += @('-TensorRtPackageReleaseTag', '${{ inputs.tensorrt_package_release_tag }}')
            }
            if (-not [string]::IsNullOrWhiteSpace('${{ inputs.tensorrt_package_release_tag_map }}')) {
              $restoreArguments += @('-TensorRtPackageReleaseTagMap', '${{ inputs.tensorrt_package_release_tag_map }}')
            }

            pwsh @restoreArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Restore-PublishedSplitPackageSource.ps1 failed for '${{ matrix.key }}' with exit code $LASTEXITCODE."
            }

            $publishedPackageSource = if (Test-Path -LiteralPath $publishedPackageSourceFile -PathType Leaf) {
              (Get-Content -LiteralPath $publishedPackageSourceFile -Raw).Trim()
            }
            else {
              ""
            }

            if (-not [string]::IsNullOrWhiteSpace($publishedPackageSource)) {
              $additionalPackageSources.Add($publishedPackageSource)
            }
            $additionalPackageSources.Add('https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json')

            $arguments += @(
              '-AdditionalPackageSource',
              ($additionalPackageSources -join ','),
              '-AdditionalPackageSourceUsername',
              '${{ github.actor }}',
              '-AdditionalPackageSourcePassword',
              '${{ github.token }}'
            )
          }

          pwsh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Invoke-LocalSplitRuntimePackage.ps1 failed for '${{ matrix.key }}' with exit code $LASTEXITCODE."
          }

          pwsh -NoProfile -File ./eng/Test-ExternalVendorRuntimePackagePolicy.ps1 `
            -PackagePath (Join-Path './artifacts/runtime-split-nupkg' '${{ matrix.key }}')

      - name: Upload Linux runtime artifacts
        if: ${{ false }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: runtime-linux-${{ matrix.key }}
          path: |
            artifacts/runtime-nupkg/*.nupkg
            artifacts/package-consumer/package-consumer-validation-summary.*
            artifacts/linux-dry-run/${{ matrix.key }}/**

      - name: Upload Linux split runtime artifacts
        if: ${{ inputs.attach_to_github_release && inputs.release_tag == '' && inputs.runtime_delivery_mode == 'split' }}
        uses: actions/upload-artifact@v7
        with:
          compression-level: 0
          name: runtime-linux-split-${{ matrix.key }}
          path: |
            artifacts/runtime-split-nupkg/${{ matrix.key }}/*.nupkg
            artifacts/package-consumer/package-consumer-validation-summary.*
            artifacts/linux-dry-run/${{ matrix.key }}/**

      - name: Retired Linux full-runtime Release upload
        if: ${{ false }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath .\artifacts\runtime-nupkg -Filter *.nupkg | Sort-Object Name)
          if ($packages.Count -eq 0) {
            throw "No Linux runtime packages were found for direct release upload."
          }

          $releaseTag = "${{ inputs.release_tag }}"
          foreach ($package in $packages) {
            Write-Host "Uploading release asset: $($package.FullName)"
            gh release upload $releaseTag $package.FullName --clobber --repo "$env:GH_REPO"
          }

      - name: Upload Linux bridge package to GitHub Release
        if: ${{ inputs.attach_to_github_release && inputs.release_tag != '' && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $splitPackageRoot = Join-Path './artifacts/runtime-split-nupkg' '${{ matrix.key }}'
          $packages = @(Get-ChildItem -LiteralPath $splitPackageRoot -Filter *.nupkg -Recurse | Sort-Object FullName)
          if ($packages.Count -eq 0) {
            throw "No Linux split runtime packages were found for runtime key '${{ matrix.key }}' under '$splitPackageRoot'."
          }

          $releaseTag = "${{ inputs.release_tag }}"
          foreach ($package in $packages) {
            $maxReleaseBytes = 2147483648
            if ($package.Length -ge $maxReleaseBytes) {
              $actualMb = [Math]::Round($package.Length / 1MB, 2)
              throw "Release asset '$($package.Name)' is ${actualMb} MB and exceeds the GitHub Release asset limit. Split the component package further before publishing."
            }

            Write-Host "Uploading release asset: $($package.FullName)"
            gh release upload $releaseTag $package.FullName --clobber --repo "$env:GH_REPO"
            if ($LASTEXITCODE -ne 0) {
              throw "gh release upload failed for '$($package.FullName)' with exit code $LASTEXITCODE."
            }
          }

      - name: Retired Linux full-runtime GitHub Packages publish
        if: ${{ false }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $maxBytes = 2147000000
          $packages = Get-ChildItem -LiteralPath ./artifacts/runtime-nupkg -Filter *.nupkg
          foreach ($package in $packages) {
            if ($package.Length -ge $maxBytes) {
              $actualMb = [Math]::Round($package.Length / 1MB, 2)
              throw "Runtime package '$($package.Name)' is ${actualMb} MB and exceeds the GitHub NuGet registry limit (< 2.147 GB). Split the runtime package before publishing."
            }
          }

          pwsh -NoProfile -File ./eng/Push-NuGetPackages.ps1 `
            -PackageRoot ./artifacts/runtime-nupkg `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 3600 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 30 `
            -SortMode size-ascending

      - name: Publish Linux bridge package to GitHub Packages
        if: ${{ inputs.publish_to_github_packages && inputs.runtime_delivery_mode == 'split' }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $maxBytes = 2147000000
          $packages = Get-ChildItem -LiteralPath ./artifacts/runtime-split-nupkg -Filter *.nupkg -Recurse
          foreach ($package in $packages) {
            if ($package.Length -ge $maxBytes) {
              $actualMb = [Math]::Round($package.Length / 1MB, 2)
              throw "Runtime split package '$($package.Name)' is ${actualMb} MB and exceeds the GitHub NuGet registry limit (< 2.147 GB). Split this component further before publishing."
            }
          }

          pwsh -NoProfile -File ./eng/Push-NuGetPackages.ps1 `
            -PackageRoot ./artifacts/runtime-split-nupkg `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 3600 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 30 `
            -Recurse `
            -SortMode size-ascending
