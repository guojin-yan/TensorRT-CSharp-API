name: release-bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      run_docs_release:
        description: Build and deploy API docs
        required: false
        default: true
        type: boolean
      runtime_version:
        description: Optional runtime package version; defaults to release version when runtime packaging is enabled
        required: false
        default: ""
        type: string
      run_windows_runtime_packaging:
        description: Build and publish Windows runtime packages
        required: false
        default: false
        type: boolean
      windows_runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: "win-x64-trt8.6-cuda11.8-cudnn8.9,win-x64-trt8.6-cuda12.1-cudnn8.9,win-x64-trt10.11-cuda11.8-cudnn8.9,win-x64-trt10.11-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda13.2-cudnn9.22"
        type: string
      windows_runtime_delivery_mode:
        description: Windows runtime package layout to produce
        required: false
        default: split
        type: string
      windows_split_package_roles:
        description: Split Windows runtime roles or keys to build
        required: false
        default: "bridge,collection"
        type: string
      windows_meta_package_version:
        description: Optional Windows split meta package version override
        required: false
        default: ""
        type: string
      windows_bridge_package_version:
        description: Optional Windows bridge split package version override
        required: false
        default: ""
        type: string
      windows_cuda_cudnn_package_version:
        description: Optional version for already-published Windows CUDA/cuDNN split packages
        required: false
        default: ""
        type: string
      windows_cuda_cudnn_package_release_tag:
        description: Optional GitHub Release tag that contains previously published Windows CUDA/cuDNN split packages; defaults to v<windows_cuda_cudnn_package_version>
        required: false
        default: ""
        type: string
      windows_tensorrt_package_version:
        description: Optional version for already-published Windows TensorRT split packages
        required: false
        default: ""
        type: string
      windows_tensorrt_package_release_tag:
        description: Optional GitHub Release tag that contains previously published Windows TensorRT split packages; defaults to v<windows_tensorrt_package_version>
        required: false
        default: ""
        type: string
      windows_include_meta_package:
        description: Build Windows split meta package when selected roles are incomplete
        required: false
        default: false
        type: boolean
      windows_skip_consumer_validation:
        description: Skip Windows split runtime consumer validation
        required: false
        default: false
        type: boolean
      run_linux_runtime_packaging:
        description: Build and publish Linux runtime packages
        required: false
        default: false
        type: boolean
      linux_runtime_keys:
        description: Optional comma-separated Linux runtime keys
        required: false
        default: ""
        type: string
      run_windows_smoke:
        description: Run Windows runtime package consumer smoke
        required: false
        default: true
        type: boolean
      sign_windows_consumer_output:
        description: Sign Windows package-consumer output before smoke
        required: false
        default: true
        type: boolean
      run_linux_smoke:
        description: Run Linux runtime package consumer smoke
        required: false
        default: false
        type: boolean
      publish_managed_to_nuget:
        description: Publish the managed package to nuget.org
        required: false
        default: false
        type: boolean
      publish_managed_to_github_packages:
        description: Publish the managed package to GitHub Packages
        required: false
        default: true
        type: boolean
      publish_runtime_to_github_packages:
        description: Publish runtime packages to GitHub Packages
        required: false
        default: false
        type: boolean
      attach_runtime_to_github_release:
        description: Upload package artifacts as GitHub Release assets
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_REF_NAME: ${{ github.ref_name }}
      GH_HEAD_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIGURATION: ${{ inputs.configuration }}
      RUN_DOCS_RELEASE: ${{ inputs.run_docs_release }}
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      RUN_WINDOWS_RUNTIME_PACKAGING: ${{ inputs.run_windows_runtime_packaging }}
      WINDOWS_RUNTIME_KEYS: ${{ inputs.windows_runtime_keys }}
      WINDOWS_RUNTIME_DELIVERY_MODE: ${{ inputs.windows_runtime_delivery_mode }}
      WINDOWS_SPLIT_PACKAGE_ROLES: ${{ inputs.windows_split_package_roles }}
      WINDOWS_META_PACKAGE_VERSION: ${{ inputs.windows_meta_package_version }}
      WINDOWS_BRIDGE_PACKAGE_VERSION: ${{ inputs.windows_bridge_package_version }}
      WINDOWS_CUDA_CUDNN_PACKAGE_VERSION: ${{ inputs.windows_cuda_cudnn_package_version }}
      WINDOWS_CUDA_CUDNN_PACKAGE_RELEASE_TAG: ${{ inputs.windows_cuda_cudnn_package_release_tag }}
      WINDOWS_TENSORRT_PACKAGE_VERSION: ${{ inputs.windows_tensorrt_package_version }}
      WINDOWS_TENSORRT_PACKAGE_RELEASE_TAG: ${{ inputs.windows_tensorrt_package_release_tag }}
      WINDOWS_INCLUDE_META_PACKAGE: ${{ inputs.windows_include_meta_package }}
      WINDOWS_SKIP_CONSUMER_VALIDATION: ${{ inputs.windows_skip_consumer_validation }}
      RUN_LINUX_RUNTIME_PACKAGING: ${{ inputs.run_linux_runtime_packaging }}
      LINUX_RUNTIME_KEYS: ${{ inputs.linux_runtime_keys }}
      RUN_WINDOWS_SMOKE: ${{ inputs.run_windows_smoke }}
      SIGN_WINDOWS_CONSUMER_OUTPUT: ${{ inputs.sign_windows_consumer_output }}
      RUN_LINUX_SMOKE: ${{ inputs.run_linux_smoke }}
      PUBLISH_MANAGED_TO_NUGET: ${{ inputs.publish_managed_to_nuget }}
      PUBLISH_MANAGED_TO_GITHUB_PACKAGES: ${{ inputs.publish_managed_to_github_packages }}
      PUBLISH_RUNTIME_TO_GITHUB_PACKAGES: ${{ inputs.publish_runtime_to_github_packages }}
      ATTACH_RUNTIME_TO_GITHUB_RELEASE: ${{ inputs.attach_runtime_to_github_release }}
      RELEASE_TAG: v${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure GitHub Release Exists
        if: ${{ inputs.attach_runtime_to_github_release }}
        shell: bash
        run: |
          set -euo pipefail

          title="$RELEASE_TAG"
          notes="Automated release for $RELEASE_TAG"
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
          else
            gh release create "$RELEASE_TAG" --title "$title" --notes "$notes" --repo "$GH_REPO"
          fi

      - name: Dispatch child workflows
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail

          state_dir="$RUNNER_TEMP/release-bundle-state"
          mkdir -p "$state_dir"
          runs_json="$state_dir/child-runs.json"
          printf '[]\n' > "$runs_json"
          runtime_version="$RUNTIME_VERSION"
          if [ -z "$runtime_version" ]; then
            runtime_version="$RELEASE_VERSION"
          fi

          role_text="$(printf '%s' "$WINDOWS_SPLIT_PACKAGE_ROLES" | tr '[:upper:]' '[:lower:]')"
          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ] &&
             [ "$WINDOWS_RUNTIME_DELIVERY_MODE" = "split" ] &&
             { [[ ",$role_text," == *",collection,"* ]] || [[ ",$role_text," == *",meta,"* ]] || [[ "$WINDOWS_INCLUDE_META_PACKAGE" = "true" ]]; } &&
             [[ ",$role_text," != *",cuda-cudnn,"* ]] &&
             [[ ",$role_text," != *",stable-dependencies,"* ]] &&
             [[ ",$role_text," != *",nvidia-dependencies,"* ]] &&
             [[ ",$role_text," != *",all,"* ]] &&
             [ -z "$WINDOWS_CUDA_CUDNN_PACKAGE_VERSION" ]; then
            echo "windows_split_package_roles includes collection/meta but no CUDA/cuDNN package version was provided." >&2
            echo "Pass windows_cuda_cudnn_package_version to pin already-published CUDA/cuDNN packages, or include cuda-cudnn/all in windows_split_package_roles for a dependency refresh." >&2
            exit 1
          fi

          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ] &&
             [ "$WINDOWS_RUNTIME_DELIVERY_MODE" = "split" ] &&
             { [[ ",$role_text," == *",collection,"* ]] || [[ ",$role_text," == *",meta,"* ]] || [[ "$WINDOWS_INCLUDE_META_PACKAGE" = "true" ]]; } &&
             [[ ",$role_text," != *",tensorrt,"* ]] &&
             [[ ",$role_text," != *",stable-dependencies,"* ]] &&
             [[ ",$role_text," != *",nvidia-dependencies,"* ]] &&
             [[ ",$role_text," != *",all,"* ]] &&
             [ -z "$WINDOWS_TENSORRT_PACKAGE_VERSION" ]; then
            echo "windows_split_package_roles includes collection/meta but no TensorRT package version was provided." >&2
            echo "Pass windows_tensorrt_package_version to pin already-published TensorRT packages, or include tensorrt/all in windows_split_package_roles for a dependency refresh." >&2
            exit 1
          fi

          dispatch_workflow() {
            local workflow_name="$1"
            shift

            local start_time
            start_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            echo "Dispatching workflow: $workflow_name"
            gh workflow run "$workflow_name" --repo "$GH_REPO" --ref "$GH_REF_NAME" "$@"

            local run_id=""
            local run_url=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list \
                --repo "$GH_REPO" \
                --workflow "$workflow_name" \
                --branch "$GH_REF_NAME" \
                --event workflow_dispatch \
                --json databaseId,createdAt,headSha,url \
                --jq 'map(select(.headSha == "'"$GH_HEAD_SHA"'" and .createdAt >= "'"$start_time"'")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"

              if [ -n "$run_id" ]; then
                run_url="$(gh run view "$run_id" --repo "$GH_REPO" --json url --jq '.url')"
                break
              fi

              sleep 5
            done

            if [ -z "$run_id" ]; then
              echo "Unable to locate the dispatched run for workflow '$workflow_name'." >&2
              exit 1
            fi

            jq \
              --arg workflow "$workflow_name" \
              --argjson id "$run_id" \
              --arg url "$run_url" \
              '. + [{workflow:$workflow,id:$id,url:$url}]' \
              "$runs_json" > "$runs_json.tmp"
            mv "$runs_json.tmp" "$runs_json"

            echo "Dispatched $workflow_name -> $run_url"
          }

          if [ "$RUN_DOCS_RELEASE" = "true" ]; then
            dispatch_workflow "docs-release"
          fi

          dispatch_workflow "package-managed" \
            -f "version=$RELEASE_VERSION" \
            -f "configuration=$RELEASE_CONFIGURATION" \
            -f "publish_to_nuget=$PUBLISH_MANAGED_TO_NUGET" \
            -f "publish_to_github_packages=$PUBLISH_MANAGED_TO_GITHUB_PACKAGES"

          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ]; then
            dispatch_workflow "runtime-windows" \
              -f "version=$runtime_version" \
              -f "configuration=$RELEASE_CONFIGURATION" \
              -f "runtime_keys=$WINDOWS_RUNTIME_KEYS" \
              -f "runtime_delivery_mode=$WINDOWS_RUNTIME_DELIVERY_MODE" \
              -f "split_package_roles=$WINDOWS_SPLIT_PACKAGE_ROLES" \
              -f "meta_package_version=$WINDOWS_META_PACKAGE_VERSION" \
              -f "bridge_package_version=$WINDOWS_BRIDGE_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version=$WINDOWS_CUDA_CUDNN_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_release_tag=$WINDOWS_CUDA_CUDNN_PACKAGE_RELEASE_TAG" \
              -f "tensorrt_package_version=$WINDOWS_TENSORRT_PACKAGE_VERSION" \
              -f "tensorrt_package_release_tag=$WINDOWS_TENSORRT_PACKAGE_RELEASE_TAG" \
              -f "include_meta_package=$WINDOWS_INCLUDE_META_PACKAGE" \
              -f "skip_consumer_validation=$WINDOWS_SKIP_CONSUMER_VALIDATION" \
              -f "run_smoke=$RUN_WINDOWS_SMOKE" \
              -f "sign_consumer_output=$SIGN_WINDOWS_CONSUMER_OUTPUT" \
              -f "publish_to_github_packages=$PUBLISH_RUNTIME_TO_GITHUB_PACKAGES" \
              -f "release_tag=$RELEASE_TAG" \
              -f "attach_to_github_release=$ATTACH_RUNTIME_TO_GITHUB_RELEASE"
          fi

          if [ "$RUN_LINUX_RUNTIME_PACKAGING" = "true" ]; then
            dispatch_workflow "runtime-linux" \
              -f "version=$runtime_version" \
              -f "configuration=$RELEASE_CONFIGURATION" \
              -f "runtime_keys=$LINUX_RUNTIME_KEYS" \
              -f "run_smoke=$RUN_LINUX_SMOKE" \
              -f "publish_to_github_packages=$PUBLISH_RUNTIME_TO_GITHUB_PACKAGES" \
              -f "release_tag=$RELEASE_TAG" \
              -f "attach_to_github_release=$ATTACH_RUNTIME_TO_GITHUB_RELEASE"
          fi

          {
            echo "runs_json<<EOF"
            jq -c '.' "$runs_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for child workflows
        id: wait
        shell: bash
        run: |
          set -euo pipefail

          state_dir="$RUNNER_TEMP/release-bundle-state"
          mkdir -p "$state_dir"
          runs_json="$state_dir/child-runs.json"
          summary_json="$state_dir/child-run-summary.json"
          summary_md="$state_dir/child-run-summary.md"

          printf '%s\n' '${{ steps.dispatch.outputs.runs_json }}' > "$runs_json"
          printf '[]\n' > "$summary_json"

          jq -c '.[]' "$runs_json" | while read -r child; do
            workflow_name="$(jq -r '.workflow' <<<"$child")"
            run_id="$(jq -r '.id' <<<"$child")"
            run_url="$(jq -r '.url' <<<"$child")"

            echo "Waiting for $workflow_name ($run_id)"

            status=""
            conclusion=""
            for attempt in $(seq 1 720); do
              status="$(gh run view "$run_id" --repo "$GH_REPO" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --repo "$GH_REPO" --json conclusion --jq '.conclusion // ""')"
              if [ "$status" = "completed" ]; then
                break
              fi

              sleep 20
            done

            if [ "$status" != "completed" ]; then
              echo "Timed out waiting for $workflow_name ($run_id)." >&2
              exit 1
            fi

            jq \
              --arg workflow "$workflow_name" \
              --argjson id "$run_id" \
              --arg url "$run_url" \
              --arg conclusion "$conclusion" \
              '. + [{workflow:$workflow,id:$id,url:$url,conclusion:$conclusion}]' \
              "$summary_json" > "$summary_json.tmp"
            mv "$summary_json.tmp" "$summary_json"
          done

          {
            echo "| Workflow | Run | Conclusion |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.workflow) | [\(.id)](\(.url)) | \(.conclusion) |"' "$summary_json"
          } > "$summary_md"

          cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"

          failed_count="$(jq '[.[] | select(.conclusion != "success")] | length' "$summary_json")"
          {
            echo "summary_json<<EOF"
            jq -c '.' "$summary_json"
            echo "EOF"
            echo "failed_count=$failed_count"
          } >> "$GITHUB_OUTPUT"

          if [ "$failed_count" -ne 0 ]; then
            echo "One or more child workflows failed." >&2
            exit 1
          fi

      - name: Download package artifacts
        if: ${{ inputs.attach_runtime_to_github_release }}
        shell: bash
        run: |
          set -euo pipefail

          download_root="$RUNNER_TEMP/release-bundle-downloads"
          mkdir -p "$download_root"

          printf '%s\n' '${{ steps.wait.outputs.summary_json }}' | jq -c '.[]' | while read -r child; do
            workflow_name="$(jq -r '.workflow' <<<"$child")"
            run_id="$(jq -r '.id' <<<"$child")"

            case "$workflow_name" in
              package-managed)
                target_dir="$download_root/$workflow_name"
                mkdir -p "$target_dir"
                if ! gh run download "$run_id" --repo "$GH_REPO" --dir "$target_dir"; then
                  echo "No downloadable artifacts for $workflow_name ($run_id)."
                fi
                ;;
            esac
          done

      - name: Create or update GitHub Release
        if: ${{ inputs.attach_runtime_to_github_release }}
        shell: bash
        run: |
          set -euo pipefail

          download_root="$RUNNER_TEMP/release-bundle-downloads"
          staging_root="$RUNNER_TEMP/release-bundle-staging"
          mkdir -p "$staging_root"

          while IFS= read -r -d '' package_file; do
            cp -f "$package_file" "$staging_root/$(basename "$package_file")"
          done < <(find "$download_root" -type f -name '*.nupkg' -print0)

          mapfile -t files < <(find "$staging_root" -maxdepth 1 -type f -name '*.nupkg' | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No nupkg artifacts were found after downloading child workflow artifacts." >&2
            exit 1
          fi

          limit=$((2 * 1024 * 1024 * 1024))
          for file in "${files[@]}"; do
            size="$(stat -c %s "$file")"
            if [ "$size" -ge "$limit" ]; then
              echo "Release asset '$file' is too large for GitHub Releases (must be under 2 GiB)." >&2
              exit 1
            fi
          done

          tag="v$RELEASE_VERSION"
          title="$tag"
          notes="Automated release for $tag"

          gh release upload "$tag" "${files[@]}" --clobber --repo "$GH_REPO"
