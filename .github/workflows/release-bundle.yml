name: release-bundle

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (must start with 4.0.x)
        required: false
        default: 4.0.0
        type: string
      configuration:
        description: Build configuration
        required: false
        default: Release
        type: string
      owner_publish_approved:
        description: Explicit Owner approval for docs, package, or Release publication side effects
        required: false
        default: false
        type: boolean
      run_docs_release:
        description: Build and deploy API docs
        required: false
        default: false
        type: boolean
      runtime_version:
        description: Optional runtime package version; defaults to release version when runtime packaging is enabled
        required: false
        default: ""
        type: string
      run_windows_runtime_packaging:
        description: Build the six Windows project-owned Bridge packages
        required: false
        default: false
        type: boolean
      windows_runtime_keys:
        description: Optional comma-separated Windows runtime keys
        required: false
        default: "win-x64-trt8.6-cuda11.8-cudnn8.9,win-x64-trt8.6-cuda12.1-cudnn8.9,win-x64-trt10.11-cuda11.8-cudnn8.9,win-x64-trt10.11-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda12.9-cudnn9.22,win-x64-trt11.0-cuda13.2-cudnn9.22"
        type: string
      windows_split_package_roles:
        description: Must be bridge; NVIDIA runtime package roles are retired
        required: false
        default: "bridge"
        type: string
      run_linux_runtime_packaging:
        description: Build the nine hosted Ubuntu 22.04/24.04 project-owned Bridge packages
        required: false
        default: false
        type: boolean
      linux_runtime_keys:
        description: Optional comma-separated hosted Linux runtime keys
        required: false
        default: ""
        type: string
      linux_runtime_key_set:
        description: Hosted Linux runtime key set when linux_runtime_keys is empty
        required: false
        default: hosted-all
        type: string
      linux_runner_mode:
        description: Hosted Linux runtime runner mode
        required: false
        default: hosted
        type: string
      linux_split_package_roles:
        description: Must be bridge; NVIDIA runtime package roles are retired
        required: false
        default: bridge
        type: string
      linux_cuda_cudnn_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      linux_tensorrt_package_version:
        description: Retired; must stay empty
        required: false
        default: ""
        type: string
      run_linux_ubuntu20_runtime_packaging:
        description: Build the three Ubuntu 20.04 project-owned Bridge packages through a hosted container lane
        required: false
        default: false
        type: boolean
      linux_ubuntu20_runtime_keys:
        description: Optional comma-separated Ubuntu 20.04 hosted-container Linux runtime keys
        required: false
        default: ""
        type: string
      run_windows_smoke:
        description: Run Windows runtime package consumer smoke
        required: false
        default: true
        type: boolean
      run_linux_smoke:
        description: Run Linux runtime package consumer smoke
        required: false
        default: false
        type: boolean
      publish_managed_to_nuget:
        description: Publish only the core managed API package to nuget.org
        required: false
        default: false
        type: boolean
      publish_managed_to_github_packages:
        description: Publish only the core managed API package to GitHub Packages
        required: false
        default: false
        type: boolean
      publish_runtime_to_github_packages:
        description: Publish project-owned bridge packages to GitHub Packages
        required: false
        default: false
        type: boolean
      publish_runtime_to_nuget:
        description: Publish project-owned bridge packages to nuget.org
        required: false
        default: false
        type: boolean
      attach_runtime_to_github_release:
        description: Upload the core managed, source, and project-owned Bridge artifacts to GitHub Release
        required: false
        default: false
        type: boolean
      release_config_json:
        description: Advanced release-bundle overrides as a JSON object
        required: false
        default: "{}"
        type: string

permissions:
  actions: write
  contents: write
  packages: write

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    environment:
      name: production-release
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      GH_REF_NAME: ${{ github.ref_name }}
      GH_HEAD_SHA: ${{ github.sha }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_CONFIGURATION: ${{ inputs.configuration }}
      OWNER_PUBLISH_APPROVED: ${{ inputs.owner_publish_approved }}
      RUN_DOCS_RELEASE: ${{ inputs.run_docs_release }}
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      RUN_WINDOWS_RUNTIME_PACKAGING: ${{ inputs.run_windows_runtime_packaging }}
      WINDOWS_RUNTIME_KEYS: ${{ inputs.windows_runtime_keys }}
      WINDOWS_SPLIT_PACKAGE_ROLES: ${{ inputs.windows_split_package_roles }}
      WINDOWS_CUDA_CUDNN_PACKAGE_VERSION: ""
      WINDOWS_TENSORRT_PACKAGE_VERSION: ""
      RUN_LINUX_RUNTIME_PACKAGING: ${{ inputs.run_linux_runtime_packaging }}
      LINUX_RUNTIME_KEYS: ${{ inputs.linux_runtime_keys }}
      LINUX_RUNTIME_KEY_SET: ${{ inputs.linux_runtime_key_set }}
      LINUX_RUNNER_MODE: ${{ inputs.linux_runner_mode }}
      LINUX_SPLIT_PACKAGE_ROLES: ${{ inputs.linux_split_package_roles }}
      LINUX_CUDA_CUDNN_PACKAGE_VERSION: ${{ inputs.linux_cuda_cudnn_package_version }}
      LINUX_TENSORRT_PACKAGE_VERSION: ${{ inputs.linux_tensorrt_package_version }}
      RUN_LINUX_UBUNTU20_RUNTIME_PACKAGING: ${{ inputs.run_linux_ubuntu20_runtime_packaging }}
      LINUX_UBUNTU20_RUNTIME_KEYS: ${{ inputs.linux_ubuntu20_runtime_keys }}
      RUN_WINDOWS_SMOKE: ${{ inputs.run_windows_smoke }}
      SIGN_WINDOWS_CONSUMER_OUTPUT: true
      RUN_LINUX_SMOKE: ${{ inputs.run_linux_smoke }}
      PUBLISH_MANAGED_TO_NUGET: ${{ inputs.publish_managed_to_nuget }}
      PUBLISH_MANAGED_TO_GITHUB_PACKAGES: ${{ inputs.publish_managed_to_github_packages }}
      PUBLISH_RUNTIME_TO_GITHUB_PACKAGES: ${{ inputs.publish_runtime_to_github_packages }}
      PUBLISH_RUNTIME_TO_NUGET: ${{ inputs.publish_runtime_to_nuget }}
      ATTACH_RUNTIME_TO_GITHUB_RELEASE: ${{ inputs.attach_runtime_to_github_release }}
      RELEASE_CONFIG_JSON: ${{ inputs.release_config_json }}
      RELEASE_TAG: v${{ inputs.version }}
      HAS_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY != '' }}
      RUNNER_AUDIT_TOKEN: ${{ secrets.RUNNER_AUDIT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate production release Environment readiness
        shell: pwsh
        env:
          PRODUCTION_RELEASE_READY: ${{ secrets.PRODUCTION_RELEASE_READY }}
        run: pwsh -NoProfile -File ./eng/Test-ProductionReleaseEnvironment.ps1 -ReadyMarker $env:PRODUCTION_RELEASE_READY

      - name: Enforce package publication policy
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 -StaticOnly
          if ('${{ github.repository_owner }}' -ne 'guojin-yan') {
            throw "release-bundle may run only in the formal guojin-yan repository. The grape-yan repository is validation-only."
          }
          $hasPublicationSideEffect = '${{ inputs.run_docs_release }}' -eq 'true' -or
            '${{ inputs.publish_managed_to_nuget }}' -eq 'true' -or
            '${{ inputs.publish_managed_to_github_packages }}' -eq 'true' -or
            '${{ inputs.publish_runtime_to_github_packages }}' -eq 'true' -or
            '${{ inputs.publish_runtime_to_nuget }}' -eq 'true' -or
            '${{ inputs.attach_runtime_to_github_release }}' -eq 'true'
          if ($hasPublicationSideEffect -and '${{ inputs.owner_publish_approved }}' -ne 'true') {
            throw "Release publication side effects require owner_publish_approved=true."
          }
          $packagePublicationRequested = '${{ inputs.publish_managed_to_nuget }}' -eq 'true' -or
            '${{ inputs.publish_managed_to_github_packages }}' -eq 'true' -or
            '${{ inputs.publish_runtime_to_github_packages }}' -eq 'true' -or
            '${{ inputs.publish_runtime_to_nuget }}' -eq 'true' -or
            '${{ inputs.attach_runtime_to_github_release }}' -eq 'true'
          if ('${{ inputs.publish_managed_to_nuget }}' -ne '${{ inputs.publish_runtime_to_nuget }}') {
            throw "nuget.org publication must include both the managed package and all Bridge packages."
          }
          if ('${{ inputs.publish_managed_to_github_packages }}' -ne '${{ inputs.publish_runtime_to_github_packages }}') {
            throw "GitHub Packages publication must include both the managed package and all Bridge packages."
          }
          if ($packagePublicationRequested -and (
              '${{ inputs.run_windows_runtime_packaging }}' -ne 'true' -or
              '${{ inputs.run_linux_runtime_packaging }}' -ne 'true' -or
              '${{ inputs.run_linux_ubuntu20_runtime_packaging }}' -ne 'true')) {
            throw "Formal package publication requires all 6 Windows, 9 hosted Linux, and 3 Ubuntu 20.04 hosted-container Bridge lanes."
          }
          if ('${{ inputs.windows_split_package_roles }}'.Trim().ToLowerInvariant() -ne 'bridge' -or
              '${{ inputs.linux_split_package_roles }}'.Trim().ToLowerInvariant() -ne 'bridge') {
            throw "Windows and Linux split_package_roles must be 'bridge'. NVIDIA runtime package roles are retired."
          }
          $retiredInputs = @(
            '${{ inputs.linux_cuda_cudnn_package_version }}',
            '${{ inputs.linux_tensorrt_package_version }}'
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $releaseConfig = '${{ inputs.release_config_json }}' | ConvertFrom-Json
          $runtimeVersion = '${{ inputs.runtime_version }}'.Trim()
          if ($packagePublicationRequested -and
              -not [string]::IsNullOrWhiteSpace($runtimeVersion) -and
              $runtimeVersion -ne '${{ inputs.version }}') {
            throw "Formal publication requires runtime_version to match version."
          }
          $bridgeVersionOverrides = @(
            [string]$releaseConfig.windows_bridge_package_version,
            [string]$releaseConfig.linux_bridge_package_version
          ) | Where-Object {
            -not [string]::IsNullOrWhiteSpace($_) -and $_ -ne '${{ inputs.version }}'
          }
          if ($packagePublicationRequested -and $bridgeVersionOverrides.Count -gt 0) {
            throw "Formal publication requires all Bridge package versions to match version."
          }
          $retiredConfigKeys = @($releaseConfig.PSObject.Properties.Name | Where-Object {
            $_ -match '(cuda_cudnn|tensorrt_package|meta_package|include_meta)'
          })
          if ($retiredInputs.Count -gt 0 -or $retiredConfigKeys.Count -gt 0) {
            throw "Vendor, meta, and full-runtime release inputs are retired. Remove: $($retiredConfigKeys -join ', ')"
          }

      - name: Validate release publish prerequisites
        shell: bash
        run: |
          set -euo pipefail

          if { [ "$PUBLISH_MANAGED_TO_NUGET" = "true" ] || [ "$PUBLISH_RUNTIME_TO_NUGET" = "true" ]; } && [ "$HAS_NUGET_API_KEY" != "true" ]; then
            echo "Publishing managed or Bridge packages to nuget.org requires the repository secret NUGET_API_KEY. Add a valid nuget.org API key secret before centralized publication." >&2
            exit 1
          fi

          runner_label_sets=()
          strict_runner_preflight=false
          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ]; then
            runner_label_sets+=("self-hosted,windows,x64")
          fi

          if [ "$RUN_LINUX_RUNTIME_PACKAGING" = "true" ] && [ "$LINUX_RUNNER_MODE" = "self-hosted" ]; then
            runner_label_sets+=("self-hosted,linux,x64")
            strict_runner_preflight=true
          fi

          if [ "${#runner_label_sets[@]}" -gt 0 ]; then
            required_label_sets="$(IFS=';'; printf '%s' "${runner_label_sets[*]}")"
            if [ -n "${RUNNER_AUDIT_TOKEN:-}" ]; then
              GH_TOKEN="$RUNNER_AUDIT_TOKEN" pwsh -NoProfile -File ./eng/Test-GitHubRunnerAvailability.ps1 \
                -Repository "$GH_REPO" \
                -RequiredLabelSet "$required_label_sets"
            elif [ "$strict_runner_preflight" = "true" ]; then
              echo "Self-hosted Linux runtime packaging requires RUNNER_AUDIT_TOKEN so release-bundle can verify runner labels before creating a Release. Add a fine-grained token that can read repository self-hosted runners, or disable the self-hosted Linux packaging lane." >&2
              exit 1
            else
              echo "::warning::Skipping Windows self-hosted runner availability preflight because RUNNER_AUDIT_TOKEN is not set. GitHub will still route runtime-windows to the required self-hosted/windows/x64 runner labels."
            fi
          fi

      - name: Dispatch child workflows
        id: dispatch
        shell: bash
        run: |
          set -euo pipefail

          state_dir="$RUNNER_TEMP/release-bundle-state"
          mkdir -p "$state_dir"
          runs_json="$state_dir/child-runs.json"
          printf '[]\n' > "$runs_json"
          runtime_version="$RUNTIME_VERSION"
          if [ -z "$runtime_version" ]; then
            runtime_version="$RELEASE_VERSION"
          fi
          config_json="$RELEASE_CONFIG_JSON"
          if [ -z "$config_json" ]; then
            config_json="{}"
          fi
          if ! jq -e 'type == "object"' <<<"$config_json" >/dev/null; then
            echo "release_config_json must be a JSON object." >&2
            exit 1
          fi

          get_config() {
            local key="$1"
            local default_value="$2"
            jq -r --arg key "$key" --arg defaultValue "$default_value" '.[$key] // $defaultValue | tostring' <<<"$config_json"
          }

          WINDOWS_RUNTIME_DELIVERY_MODE="$(get_config windows_runtime_delivery_mode split)"
          WINDOWS_META_PACKAGE_VERSION="$(get_config windows_meta_package_version '')"
          WINDOWS_BRIDGE_PACKAGE_VERSION="$(get_config windows_bridge_package_version '')"
          WINDOWS_CUDA_CUDNN_PACKAGE_RELEASE_TAG="$(get_config windows_cuda_cudnn_package_release_tag '')"
          WINDOWS_CUDA_CUDNN_PACKAGE_VERSION_MAP="$(get_config windows_cuda_cudnn_package_version_map '')"
          WINDOWS_CUDA_CUDNN_PACKAGE_RELEASE_TAG_MAP="$(get_config windows_cuda_cudnn_package_release_tag_map '')"
          WINDOWS_TENSORRT_PACKAGE_RELEASE_TAG="$(get_config windows_tensorrt_package_release_tag '')"
          WINDOWS_TENSORRT_PACKAGE_VERSION_MAP="$(get_config windows_tensorrt_package_version_map '')"
          WINDOWS_TENSORRT_PACKAGE_RELEASE_TAG_MAP="$(get_config windows_tensorrt_package_release_tag_map '')"
          WINDOWS_INCLUDE_META_PACKAGE="$(get_config windows_include_meta_package false)"
          WINDOWS_SKIP_CONSUMER_VALIDATION="$(get_config windows_skip_consumer_validation false)"
          LINUX_RUNTIME_DELIVERY_MODE="$(get_config linux_runtime_delivery_mode split)"
          LINUX_META_PACKAGE_VERSION="$(get_config linux_meta_package_version '')"
          LINUX_BRIDGE_PACKAGE_VERSION="$(get_config linux_bridge_package_version '')"
          LINUX_CUDA_CUDNN_PACKAGE_RELEASE_TAG="$(get_config linux_cuda_cudnn_package_release_tag '')"
          LINUX_CUDA_CUDNN_PACKAGE_VERSION_MAP="$(get_config linux_cuda_cudnn_package_version_map '')"
          LINUX_CUDA_CUDNN_PACKAGE_RELEASE_TAG_MAP="$(get_config linux_cuda_cudnn_package_release_tag_map '')"
          LINUX_TENSORRT_PACKAGE_RELEASE_TAG="$(get_config linux_tensorrt_package_release_tag '')"
          LINUX_TENSORRT_PACKAGE_VERSION_MAP="$(get_config linux_tensorrt_package_version_map '')"
          LINUX_TENSORRT_PACKAGE_RELEASE_TAG_MAP="$(get_config linux_tensorrt_package_release_tag_map '')"
          LINUX_INCLUDE_META_PACKAGE="$(get_config linux_include_meta_package false)"
          LINUX_SKIP_CONSUMER_VALIDATION="$(get_config linux_skip_consumer_validation false)"
          LINUX_UBUNTU20_RUNTIME_KEY_SET="$(get_config linux_ubuntu20_runtime_key_set "$(get_config linux_self_hosted_ubuntu20_runtime_key_set hosted-container-ubuntu20)")"

          role_text="$(printf '%s' "$WINDOWS_SPLIT_PACKAGE_ROLES" | tr '[:upper:]' '[:lower:]')"
          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ] &&
             [ "$WINDOWS_RUNTIME_DELIVERY_MODE" = "split" ] &&
             { [[ ",$role_text," == *",collection,"* ]] || [[ ",$role_text," == *",meta,"* ]] || [[ "$WINDOWS_INCLUDE_META_PACKAGE" = "true" ]]; } &&
             [[ ",$role_text," != *",cuda-cudnn,"* ]] &&
             [[ ",$role_text," != *",stable-dependencies,"* ]] &&
             [[ ",$role_text," != *",nvidia-dependencies,"* ]] &&
             [[ ",$role_text," != *",all,"* ]] &&
             [ -z "$WINDOWS_CUDA_CUDNN_PACKAGE_VERSION" ] &&
             [ -z "$WINDOWS_CUDA_CUDNN_PACKAGE_VERSION_MAP" ]; then
            echo "windows_split_package_roles includes collection/meta but no CUDA/cuDNN package version was provided." >&2
            echo "Pass windows_cuda_cudnn_package_version or windows_cuda_cudnn_package_version_map to pin already-published CUDA/cuDNN packages, or include cuda-cudnn/all in windows_split_package_roles for a dependency refresh." >&2
            exit 1
          fi

          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ] &&
             [ "$WINDOWS_RUNTIME_DELIVERY_MODE" = "split" ] &&
             { [[ ",$role_text," == *",collection,"* ]] || [[ ",$role_text," == *",meta,"* ]] || [[ "$WINDOWS_INCLUDE_META_PACKAGE" = "true" ]]; } &&
             [[ ",$role_text," != *",tensorrt,"* ]] &&
             [[ ",$role_text," != *",stable-dependencies,"* ]] &&
             [[ ",$role_text," != *",nvidia-dependencies,"* ]] &&
             [[ ",$role_text," != *",all,"* ]] &&
             [ -z "$WINDOWS_TENSORRT_PACKAGE_VERSION" ] &&
             [ -z "$WINDOWS_TENSORRT_PACKAGE_VERSION_MAP" ]; then
            echo "windows_split_package_roles includes collection/meta but no TensorRT package version was provided." >&2
            echo "Pass windows_tensorrt_package_version or windows_tensorrt_package_version_map to pin already-published TensorRT packages, or include tensorrt/all in windows_split_package_roles for a dependency refresh." >&2
            exit 1
          fi

          linux_role_text="$(printf '%s' "$LINUX_SPLIT_PACKAGE_ROLES" | tr '[:upper:]' '[:lower:]')"
          if { [ "$RUN_LINUX_RUNTIME_PACKAGING" = "true" ] || [ "$RUN_LINUX_UBUNTU20_RUNTIME_PACKAGING" = "true" ]; } &&
             [ "$LINUX_RUNTIME_DELIVERY_MODE" = "split" ] &&
             { [[ ",$linux_role_text," == *",collection,"* ]] || [[ ",$linux_role_text," == *",meta,"* ]] || [[ "$LINUX_INCLUDE_META_PACKAGE" = "true" ]]; } &&
             [[ ",$linux_role_text," != *",cuda-cudnn,"* ]] &&
             [[ ",$linux_role_text," != *",stable-dependencies,"* ]] &&
             [[ ",$linux_role_text," != *",nvidia-dependencies,"* ]] &&
             [[ ",$linux_role_text," != *",all,"* ]] &&
             [ -z "$LINUX_CUDA_CUDNN_PACKAGE_VERSION" ] &&
             [ -z "$LINUX_CUDA_CUDNN_PACKAGE_VERSION_MAP" ]; then
            echo "linux_split_package_roles includes collection/meta but no CUDA/cuDNN package version was provided." >&2
            echo "Pass linux_cuda_cudnn_package_version or linux_cuda_cudnn_package_version_map to pin already-published CUDA/cuDNN packages, or include cuda-cudnn/all in linux_split_package_roles for a dependency refresh." >&2
            exit 1
          fi

          if { [ "$RUN_LINUX_RUNTIME_PACKAGING" = "true" ] || [ "$RUN_LINUX_UBUNTU20_RUNTIME_PACKAGING" = "true" ]; } &&
             [ "$LINUX_RUNTIME_DELIVERY_MODE" = "split" ] &&
             { [[ ",$linux_role_text," == *",collection,"* ]] || [[ ",$linux_role_text," == *",meta,"* ]] || [[ "$LINUX_INCLUDE_META_PACKAGE" = "true" ]]; } &&
             [[ ",$linux_role_text," != *",tensorrt,"* ]] &&
             [[ ",$linux_role_text," != *",stable-dependencies,"* ]] &&
             [[ ",$linux_role_text," != *",nvidia-dependencies,"* ]] &&
             [[ ",$linux_role_text," != *",all,"* ]] &&
             [ -z "$LINUX_TENSORRT_PACKAGE_VERSION" ] &&
             [ -z "$LINUX_TENSORRT_PACKAGE_VERSION_MAP" ]; then
            echo "linux_split_package_roles includes collection/meta but no TensorRT package version was provided." >&2
            echo "Pass linux_tensorrt_package_version or linux_tensorrt_package_version_map to pin already-published TensorRT packages, or include tensorrt/all in linux_split_package_roles for a dependency refresh." >&2
            exit 1
          fi

          dispatch_workflow() {
            local workflow_name="$1"
            local run_label="$workflow_name"
            shift
            if [ "${1:-}" = "--label" ]; then
              run_label="$2"
              shift 2
            fi

            local start_time
            start_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

            echo "Dispatching workflow: $run_label ($workflow_name)"
            gh workflow run "$workflow_name" --repo "$GH_REPO" --ref "$GH_REF_NAME" "$@"

            local run_id=""
            local run_url=""
            for attempt in $(seq 1 60); do
              run_id="$(gh run list \
                --repo "$GH_REPO" \
                --workflow "$workflow_name" \
                --branch "$GH_REF_NAME" \
                --event workflow_dispatch \
                --json databaseId,createdAt,headSha,url \
                --jq 'map(select(.headSha == "'"$GH_HEAD_SHA"'" and .createdAt >= "'"$start_time"'")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"

              if [ -n "$run_id" ]; then
                run_url="$(gh run view "$run_id" --repo "$GH_REPO" --json url --jq '.url')"
                break
              fi

              sleep 5
            done

            if [ -z "$run_id" ]; then
              echo "Unable to locate the dispatched run for workflow '$workflow_name'." >&2
              exit 1
            fi

            jq \
              --arg workflow "$run_label" \
              --arg workflowFile "$workflow_name" \
              --argjson id "$run_id" \
              --arg url "$run_url" \
              '. + [{workflow:$workflow,workflowFile:$workflowFile,id:$id,url:$url}]' \
              "$runs_json" > "$runs_json.tmp"
            mv "$runs_json.tmp" "$runs_json"

            echo "Dispatched $run_label -> $run_url"
          }

          dispatch_workflow "package-managed" \
            -f "version=$RELEASE_VERSION" \
            -f "configuration=$RELEASE_CONFIGURATION" \
            -f "owner_publish_approved=$OWNER_PUBLISH_APPROVED" \
            -f "publish_to_nuget=false" \
            -f "publish_to_github_packages=false" \
            -f "release_tag=$RELEASE_TAG" \
            -f "attach_to_github_release=false"

          dispatch_workflow "package-source" \
            -f "version=$RELEASE_VERSION" \
            -f "owner_publish_approved=$OWNER_PUBLISH_APPROVED" \
            -f "release_tag=$RELEASE_TAG" \
            -f "attach_to_github_release=false"

          if [ "$RUN_WINDOWS_RUNTIME_PACKAGING" = "true" ]; then
            dispatch_workflow "runtime-windows" \
              -f "version=$runtime_version" \
              -f "configuration=$RELEASE_CONFIGURATION" \
              -f "owner_publish_approved=$OWNER_PUBLISH_APPROVED" \
              -f "runtime_keys=$WINDOWS_RUNTIME_KEYS" \
              -f "runtime_delivery_mode=$WINDOWS_RUNTIME_DELIVERY_MODE" \
              -f "split_package_roles=$WINDOWS_SPLIT_PACKAGE_ROLES" \
              -f "meta_package_version=$WINDOWS_META_PACKAGE_VERSION" \
              -f "bridge_package_version=$WINDOWS_BRIDGE_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version=$WINDOWS_CUDA_CUDNN_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version_map=$WINDOWS_CUDA_CUDNN_PACKAGE_VERSION_MAP" \
              -f "cuda_cudnn_package_release_tag=$WINDOWS_CUDA_CUDNN_PACKAGE_RELEASE_TAG" \
              -f "cuda_cudnn_package_release_tag_map=$WINDOWS_CUDA_CUDNN_PACKAGE_RELEASE_TAG_MAP" \
              -f "tensorrt_package_version=$WINDOWS_TENSORRT_PACKAGE_VERSION" \
              -f "tensorrt_package_version_map=$WINDOWS_TENSORRT_PACKAGE_VERSION_MAP" \
              -f "tensorrt_package_release_tag=$WINDOWS_TENSORRT_PACKAGE_RELEASE_TAG" \
              -f "tensorrt_package_release_tag_map=$WINDOWS_TENSORRT_PACKAGE_RELEASE_TAG_MAP" \
              -f "include_meta_package=$WINDOWS_INCLUDE_META_PACKAGE" \
              -f "skip_consumer_validation=$WINDOWS_SKIP_CONSUMER_VALIDATION" \
              -f "run_smoke=$RUN_WINDOWS_SMOKE" \
              -f "sign_consumer_output=$SIGN_WINDOWS_CONSUMER_OUTPUT" \
              -f "publish_to_github_packages=false" \
              -f "publish_to_nuget=false" \
              -f "release_tag=$RELEASE_TAG" \
              -f "attach_to_github_release=false"
          fi

          if [ "$RUN_LINUX_RUNTIME_PACKAGING" = "true" ]; then
            dispatch_workflow "runtime-linux" --label "runtime-linux-hosted" \
              -f "version=$runtime_version" \
              -f "configuration=$RELEASE_CONFIGURATION" \
              -f "owner_publish_approved=$OWNER_PUBLISH_APPROVED" \
              -f "runtime_keys=$LINUX_RUNTIME_KEYS" \
              -f "runtime_key_set=$LINUX_RUNTIME_KEY_SET" \
              -f "runner_mode=$LINUX_RUNNER_MODE" \
              -f "runtime_delivery_mode=$LINUX_RUNTIME_DELIVERY_MODE" \
              -f "split_package_roles=$LINUX_SPLIT_PACKAGE_ROLES" \
              -f "meta_package_version=$LINUX_META_PACKAGE_VERSION" \
              -f "bridge_package_version=$LINUX_BRIDGE_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version=$LINUX_CUDA_CUDNN_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version_map=$LINUX_CUDA_CUDNN_PACKAGE_VERSION_MAP" \
              -f "cuda_cudnn_package_release_tag=$LINUX_CUDA_CUDNN_PACKAGE_RELEASE_TAG" \
              -f "cuda_cudnn_package_release_tag_map=$LINUX_CUDA_CUDNN_PACKAGE_RELEASE_TAG_MAP" \
              -f "tensorrt_package_version=$LINUX_TENSORRT_PACKAGE_VERSION" \
              -f "tensorrt_package_version_map=$LINUX_TENSORRT_PACKAGE_VERSION_MAP" \
              -f "tensorrt_package_release_tag=$LINUX_TENSORRT_PACKAGE_RELEASE_TAG" \
              -f "tensorrt_package_release_tag_map=$LINUX_TENSORRT_PACKAGE_RELEASE_TAG_MAP" \
              -f "include_meta_package=$LINUX_INCLUDE_META_PACKAGE" \
              -f "skip_consumer_validation=$LINUX_SKIP_CONSUMER_VALIDATION" \
              -f "run_smoke=$RUN_LINUX_SMOKE" \
              -f "publish_to_github_packages=false" \
              -f "publish_to_nuget=false" \
              -f "release_tag=$RELEASE_TAG" \
              -f "attach_to_github_release=false"
          fi

          if [ "$RUN_LINUX_UBUNTU20_RUNTIME_PACKAGING" = "true" ]; then
            dispatch_workflow "runtime-linux" --label "runtime-linux-hosted-container-ubuntu20" \
              -f "version=$runtime_version" \
              -f "configuration=$RELEASE_CONFIGURATION" \
              -f "owner_publish_approved=$OWNER_PUBLISH_APPROVED" \
              -f "runtime_keys=$LINUX_UBUNTU20_RUNTIME_KEYS" \
              -f "runtime_key_set=$LINUX_UBUNTU20_RUNTIME_KEY_SET" \
              -f "runner_mode=hosted-container" \
              -f "runtime_delivery_mode=$LINUX_RUNTIME_DELIVERY_MODE" \
              -f "split_package_roles=$LINUX_SPLIT_PACKAGE_ROLES" \
              -f "meta_package_version=$LINUX_META_PACKAGE_VERSION" \
              -f "bridge_package_version=$LINUX_BRIDGE_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version=$LINUX_CUDA_CUDNN_PACKAGE_VERSION" \
              -f "cuda_cudnn_package_version_map=$LINUX_CUDA_CUDNN_PACKAGE_VERSION_MAP" \
              -f "cuda_cudnn_package_release_tag=$LINUX_CUDA_CUDNN_PACKAGE_RELEASE_TAG" \
              -f "cuda_cudnn_package_release_tag_map=$LINUX_CUDA_CUDNN_PACKAGE_RELEASE_TAG_MAP" \
              -f "tensorrt_package_version=$LINUX_TENSORRT_PACKAGE_VERSION" \
              -f "tensorrt_package_version_map=$LINUX_TENSORRT_PACKAGE_VERSION_MAP" \
              -f "tensorrt_package_release_tag=$LINUX_TENSORRT_PACKAGE_RELEASE_TAG" \
              -f "tensorrt_package_release_tag_map=$LINUX_TENSORRT_PACKAGE_RELEASE_TAG_MAP" \
              -f "include_meta_package=$LINUX_INCLUDE_META_PACKAGE" \
              -f "skip_consumer_validation=$LINUX_SKIP_CONSUMER_VALIDATION" \
              -f "run_smoke=$RUN_LINUX_SMOKE" \
              -f "publish_to_github_packages=false" \
              -f "publish_to_nuget=false" \
              -f "release_tag=$RELEASE_TAG" \
              -f "attach_to_github_release=false"
          fi

          {
            echo "runs_json<<EOF"
            jq -c '.' "$runs_json"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for child workflows
        id: wait
        shell: bash
        run: |
          set -euo pipefail

          state_dir="$RUNNER_TEMP/release-bundle-state"
          mkdir -p "$state_dir"
          runs_json="$state_dir/child-runs.json"
          summary_json="$state_dir/child-run-summary.json"
          summary_md="$state_dir/child-run-summary.md"

          printf '%s\n' '${{ steps.dispatch.outputs.runs_json }}' > "$runs_json"
          printf '[]\n' > "$summary_json"

          jq -c '.[]' "$runs_json" | while read -r child; do
            workflow_name="$(jq -r '.workflow' <<<"$child")"
            run_id="$(jq -r '.id' <<<"$child")"
            run_url="$(jq -r '.url' <<<"$child")"

            echo "Waiting for $workflow_name ($run_id)"

            status=""
            conclusion=""
            for attempt in $(seq 1 720); do
              status="$(gh run view "$run_id" --repo "$GH_REPO" --json status --jq '.status')"
              conclusion="$(gh run view "$run_id" --repo "$GH_REPO" --json conclusion --jq '.conclusion // ""')"
              if [ "$status" = "completed" ]; then
                break
              fi

              sleep 20
            done

            if [ "$status" != "completed" ]; then
              echo "Timed out waiting for $workflow_name ($run_id)." >&2
              exit 1
            fi

            jq \
              --arg workflow "$workflow_name" \
              --argjson id "$run_id" \
              --arg url "$run_url" \
              --arg conclusion "$conclusion" \
              '. + [{workflow:$workflow,id:$id,url:$url,conclusion:$conclusion}]' \
              "$summary_json" > "$summary_json.tmp"
            mv "$summary_json.tmp" "$summary_json"
          done

          {
            echo "| Workflow | Run | Conclusion |"
            echo "| --- | --- | --- |"
            jq -r '.[] | "| \(.workflow) | [\(.id)](\(.url)) | \(.conclusion) |"' "$summary_json"
          } > "$summary_md"

          cat "$summary_md" >> "$GITHUB_STEP_SUMMARY"

          failed_count="$(jq '[.[] | select(.conclusion != "success")] | length' "$summary_json")"
          {
            echo "summary_json<<EOF"
            jq -c '.' "$summary_json"
            echo "EOF"
            echo "failed_count=$failed_count"
          } >> "$GITHUB_OUTPUT"

          if [ "$failed_count" -ne 0 ]; then
            echo "One or more child workflows failed." >&2
            exit 1
          fi

      - name: Download package artifacts
        if: ${{ inputs.publish_managed_to_nuget || inputs.publish_managed_to_github_packages || inputs.publish_runtime_to_github_packages || inputs.publish_runtime_to_nuget || inputs.attach_runtime_to_github_release }}
        shell: bash
        run: |
          set -euo pipefail

          download_root="$RUNNER_TEMP/release-bundle-downloads"
          mkdir -p "$download_root"

          printf '%s\n' '${{ steps.wait.outputs.summary_json }}' | jq -c '.[]' | while read -r child; do
            workflow_name="$(jq -r '.workflow' <<<"$child")"
            run_id="$(jq -r '.id' <<<"$child")"

            case "$workflow_name" in
              package-managed|package-source|runtime-windows|runtime-linux-hosted|runtime-linux-hosted-container-ubuntu20)
                target_dir="$download_root/$workflow_name"
                mkdir -p "$target_dir"
                gh run download "$run_id" --repo "$GH_REPO" --dir "$target_dir"
                ;;
            esac
          done

      - name: Stage exact formal release payload
        if: ${{ inputs.publish_managed_to_nuget || inputs.publish_managed_to_github_packages || inputs.publish_runtime_to_github_packages || inputs.publish_runtime_to_nuget || inputs.attach_runtime_to_github_release }}
        shell: bash
        run: |
          set -euo pipefail

          download_root="$RUNNER_TEMP/release-bundle-downloads"
          staging_root="$RUNNER_TEMP/release-bundle-staging"
          mkdir -p "$staging_root"

          stage_unique() {
            local source_file="$1"
            local target_file="$staging_root/$(basename "$source_file")"
            if [ -f "$target_file" ]; then
              if ! cmp -s "$source_file" "$target_file"; then
                echo "Conflicting artifacts share the filename '$(basename "$source_file")'." >&2
                exit 1
              fi
              return
            fi
            cp "$source_file" "$target_file"
          }

          while IFS= read -r -d '' package_file; do
            stage_unique "$package_file"
          done < <(find "$download_root/package-managed" -type f -name '*.nupkg' -print0)

          for runtime_dir in \
            "$download_root/runtime-windows" \
            "$download_root/runtime-linux-hosted" \
            "$download_root/runtime-linux-hosted-container-ubuntu20"; do
            while IFS= read -r -d '' package_file; do
              package_name="$(basename "$package_file")"
              if [[ "$package_name" == JYPPX.TensorRT.CSharp.API.Runtime.*.Bridge."$RELEASE_VERSION".nupkg ]]; then
                stage_unique "$package_file"
              elif [ "$package_name" != "JYPPX.TensorRT.CSharp.API.$RELEASE_VERSION.nupkg" ]; then
                echo "Unexpected non-Bridge package in runtime artifacts: $package_name" >&2
                exit 1
              fi
            done < <(find "$runtime_dir" -type f -name '*.nupkg' -print0)
          done

          while IFS= read -r -d '' source_file; do
            stage_unique "$source_file"
          done < <(find "$download_root/package-source" -type f -name '*.zip' -print0)

          mapfile -t nupkg_files < <(find "$staging_root" -maxdepth 1 -type f -name '*.nupkg' | sort)
          mapfile -t source_files < <(find "$staging_root" -maxdepth 1 -type f -name '*.zip' | sort)
          managed_count=0
          bridge_count=0
          actual_bridge_names="$RUNNER_TEMP/release-bundle-actual-bridge-names.txt"
          expected_bridge_names="$RUNNER_TEMP/release-bundle-expected-bridge-names.txt"
          : > "$actual_bridge_names"
          for package_file in "${nupkg_files[@]}"; do
            package_name="$(basename "$package_file")"
            if [ "$package_name" = "JYPPX.TensorRT.CSharp.API.$RELEASE_VERSION.nupkg" ]; then
              managed_count=$((managed_count + 1))
            elif [[ "$package_name" == JYPPX.TensorRT.CSharp.API.Runtime.*.Bridge."$RELEASE_VERSION".nupkg ]]; then
              bridge_count=$((bridge_count + 1))
              printf '%s\n' "$package_name" >> "$actual_bridge_names"
            else
              echo "Unexpected package in formal release payload: $package_name" >&2
              exit 1
            fi
          done

          jq -r --arg version "$RELEASE_VERSION" \
            '.packages[] | select(.platform == "windows" or .platform == "linux") | "\(.packageId).Bridge.\($version).nupkg"' \
            "$GITHUB_WORKSPACE/pack/runtime/runtime-packages.manifest.json" \
            | sort > "$expected_bridge_names"
          sort -o "$actual_bridge_names" "$actual_bridge_names"

          expected_source="TensorRtSharp4.0-source-$RELEASE_VERSION.zip"
          if [ "${#nupkg_files[@]}" -ne 19 ] || [ "$managed_count" -ne 1 ] || [ "$bridge_count" -ne 18 ]; then
            echo "Formal release payload must contain exactly 19 NuGet packages: 1 managed package and 18 Bridge packages." >&2
            exit 1
          fi
          if ! diff -u "$expected_bridge_names" "$actual_bridge_names"; then
            echo "Bridge package inventory does not match the fixed 6 Windows + 12 Linux runtime manifest." >&2
            exit 1
          fi
          if [ "${#source_files[@]}" -ne 1 ] || [ "$(basename "${source_files[0]}")" != "$expected_source" ]; then
            echo "Formal release payload must contain exactly one source archive named '$expected_source'." >&2
            exit 1
          fi

          source_metadata="$download_root/package-source/source-package/TensorRtSharp4.0-source-$RELEASE_VERSION.json"
          if [ ! -f "$source_metadata" ]; then
            source_metadata="$(find "$download_root/package-source" -type f -name "TensorRtSharp4.0-source-$RELEASE_VERSION.json" -print -quit)"
          fi
          if [ -z "$source_metadata" ] || [ ! -f "$source_metadata" ]; then
            echo "Source archive metadata was not downloaded." >&2
            exit 1
          fi
          source_sha="$(sha256sum "${source_files[0]}" | awk '{print $1}')"
          jq -e \
            --arg version "$RELEASE_VERSION" \
            --arg commit "$GH_HEAD_SHA" \
            --arg archive "$expected_source" \
            --arg sha "$source_sha" \
            '.version == $version and .commit == $commit and .archiveName == $archive and .sha256 == $sha and .trackedFilesOnly == true and .vendorRuntimeBinaryCount == 0' \
            "$source_metadata" >/dev/null

          limit=$((2 * 1024 * 1024 * 1024))
          for file in "${nupkg_files[@]}" "${source_files[@]}"; do
            size="$(stat -c %s "$file")"
            if [ "$size" -ge "$limit" ]; then
              echo "Release asset '$file' is too large for GitHub Releases (must be under 2 GiB)." >&2
              exit 1
            fi
          done

          printf 'Validated formal release payload: %s managed + %s Bridge + %s source archive.\n' \
            "$managed_count" "$bridge_count" "${#source_files[@]}"

      - name: Validate staged release licenses and vendor boundary
        if: ${{ inputs.publish_managed_to_nuget || inputs.publish_managed_to_github_packages || inputs.publish_runtime_to_github_packages || inputs.publish_runtime_to_nuget || inputs.attach_runtime_to_github_release }}
        shell: pwsh
        run: |
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'release-bundle-staging'
          pwsh -NoProfile -File .\eng\Test-ExternalVendorRuntimePackagePolicy.ps1 -PackagePath $stagingRoot
          pwsh -NoProfile -File .\eng\Test-PublicationLicenseReadiness.ps1 -ArtifactPath $stagingRoot

      - name: Publish exact package set to GitHub Packages
        if: ${{ inputs.publish_managed_to_github_packages && inputs.publish_runtime_to_github_packages }}
        shell: pwsh
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'release-bundle-staging'
          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot $stagingRoot `
            -Source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            -ApiKeyEnvironmentVariable GITHUB_PACKAGES_TOKEN `
            -TimeoutSeconds 1800 `
            -MaxAttempts 3 `
            -RetryDelaySeconds 15

      - name: Publish exact package set to nuget.org
        if: ${{ inputs.publish_managed_to_nuget && inputs.publish_runtime_to_nuget }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          $stagingRoot = Join-Path $env:RUNNER_TEMP 'release-bundle-staging'
          pwsh -NoProfile -File .\eng\Test-PublishPrerequisites.ps1 `
            -Target nuget.org `
            -ApiKey $env:NUGET_API_KEY
          pwsh -NoProfile -File .\eng\Push-NuGetPackages.ps1 `
            -PackageRoot $stagingRoot `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKeyEnvironmentVariable NUGET_API_KEY `
            -TimeoutSeconds 1800 `
            -MaxAttempts 2 `
            -RetryDelaySeconds 15

      - name: Create Stable public GitHub Release
        if: ${{ inputs.attach_runtime_to_github_release }}
        shell: bash
        run: |
          set -euo pipefail

          staging_root="$RUNNER_TEMP/release-bundle-staging"
          tag="v$RELEASE_VERSION"
          title="TensorRT-CSharp-API $RELEASE_VERSION"
          notes_path="$GITHUB_WORKSPACE/docs/releases/$RELEASE_VERSION.md"
          if [ ! -f "$notes_path" ]; then
            echo "Release notes do not exist: $notes_path" >&2
            exit 1
          fi

          mapfile -t files < <(find "$staging_root" -maxdepth 1 -type f \( -name '*.nupkg' -o -name '*.zip' \) | sort)
          if [ "${#files[@]}" -ne 20 ]; then
            echo "Stable GitHub Release requires exactly 20 assets: 19 NuGet packages and 1 source archive." >&2
            exit 1
          fi

          if ! gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            if ! gh release create "$tag" \
              --target "$GH_HEAD_SHA" \
              --title "$title" \
              --notes-file "$notes_path" \
              --draft \
              --repo "$GH_REPO"; then
              gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1
            fi
          fi

          tag_commit="$(gh api "repos/$GH_REPO/commits/$tag" --jq '.sha')"
          if [ "$tag_commit" != "$GH_HEAD_SHA" ]; then
            echo "Release tag '$tag' resolves to '$tag_commit', expected '$GH_HEAD_SHA'." >&2
            exit 1
          fi

          gh release upload "$tag" "${files[@]}" --clobber --repo "$GH_REPO"

          release_id="$(gh api "repos/$GH_REPO/releases/tags/$tag" --jq '.id')"
          jq -n \
            --arg name "$title" \
            --rawfile body "$notes_path" \
            '{name:$name,body:$body,draft:false,prerelease:false}' \
            | gh api --method PATCH "repos/$GH_REPO/releases/$release_id" --input - >/dev/null

          gh api "repos/$GH_REPO/releases/tags/$tag" \
            | jq -e \
              --arg tag "$tag" \
              --arg title "$title" \
              'select(.tag_name == $tag and .name == $title and .draft == false and .prerelease == false)' \
              >/dev/null

      - name: Dispatch and wait for API docs release
        if: ${{ inputs.run_docs_release }}
        shell: bash
        run: |
          set -euo pipefail

          start_time="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          gh workflow run docs-release.yml \
            --repo "$GH_REPO" \
            --ref "$GH_REF_NAME" \
            -f "owner_publish_approved=$OWNER_PUBLISH_APPROVED"

          run_id=""
          for attempt in $(seq 1 60); do
            run_id="$(gh run list \
              --repo "$GH_REPO" \
              --workflow docs-release.yml \
              --branch "$GH_REF_NAME" \
              --event workflow_dispatch \
              --json databaseId,createdAt,headSha \
              --jq 'map(select(.headSha == "'"$GH_HEAD_SHA"'" and .createdAt >= "'"$start_time"'")) | sort_by(.createdAt) | reverse | .[0].databaseId // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Unable to locate the dispatched docs-release run." >&2
            exit 1
          fi

          gh run watch "$run_id" --repo "$GH_REPO" --exit-status
